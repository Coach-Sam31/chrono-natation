<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chrono">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b5aa3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Chrono · Compétition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Mode Course (C1, §13 du cahier) : mêmes couleurs et mêmes polices que l'entraînement (index.html). */
:root {
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%;
  --bg: #e9f0f3; --surface: #ffffff; --ink: #06202c; --muted: #4f6873; --line: #b9cbd3;
  --lane: #0b5aa3; --lane-ink: #ffffff; --hot: #ffd400; --hot-ink: #1a1600; --wait: #d5e0e5; --done: #dfe7ea;
  --warn: #b93a07; --start: #d6141f; --start-ink: #ffffff; --wall: #0f2b3d; --wall-ink: #ffffff; --wall-muted: #b9d0dc;
  --nage: #6a2fb5; --nage-ink: #ffffff; --cbq: #0a7d4f; --cbq-ink: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061118; --surface: #0f2430; --ink: #eaf4f8; --muted: #8fa9b4; --line: #26414e;
    --lane: #4aa3ff; --lane-ink: #04121a; --hot: #ffd400; --hot-ink: #1a1600; --wait: #13303d; --done: #0a1a22; --warn: #ff8a4c;
    --nage: #b693ff; --nage-ink: #1a0b33; --cbq: #3ddc97; --cbq-ink: #04121a; --wall: #dfeaf0; --wall-ink: #06202c; --wall-muted: #3d5866; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061118; --surface: #0f2430; --ink: #eaf4f8; --muted: #8fa9b4; --line: #26414e;
  --lane: #4aa3ff; --lane-ink: #04121a; --hot: #ffd400; --hot-ink: #1a1600; --wait: #13303d; --done: #0a1a22; --warn: #ff8a4c;
  --nage: #b693ff; --nage-ink: #1a0b33; --cbq: #3ddc97; --cbq-ink: #04121a; --wall: #dfeaf0; --wall-ink: #06202c; --wall-muted: #3d5866; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overflow: hidden;
}
[hidden] { display: none !important; }
#app { height: 100%; }
* { touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px !important; } /* l'iPad zoome sur un champ plus petit */
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.view { height: 100%; display: flex; flex-direction: column; gap: 8px; padding-block: 10px 20px; box-sizing: border-box; }
.scroll { overflow-y: auto; flex: 1; min-height: 0; }
.panel { max-width: 860px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 36px; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; }
.note { color: var(--muted); margin: 0; max-width: 65ch; }
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; min-height: 52px; }
.btn.big { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 8px 22px; }
.btn.go { background: var(--lane); color: var(--lane-ink); border-color: var(--lane); }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .35; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .nrow select, .nrow input { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; min-height: 48px; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.choix { display: flex; gap: 6px; flex-wrap: wrap; }
.choix button { min-width: 64px; min-height: 52px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-family: var(--font-display); font-weight: 700; font-size: 22px; padding: 4px 12px; }
.choix button.on { background: var(--lane); color: var(--lane-ink); border-color: var(--lane); }
.nrows { display: flex; flex-direction: column; gap: 8px; }
.nrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) 96px; gap: 8px; align-items: center; }
@media (max-width: 600px) { .nrow { grid-template-columns: minmax(0, 1fr) 84px; } .nrow .libre { grid-column: 1; } }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hist-row { display: flex; gap: 8px; align-items: stretch; }
.hist-item { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; min-height: 52px; }
.hist-item span { color: var(--muted); font-size: 14px; }
.hist-item.live { border-color: var(--lane); border-width: 3px; }
.warn { color: var(--warn); font-weight: 700; }
/* Programme (C3a) */
h3.jour { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 8px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.hist-item.prog .h { font-family: var(--font-display); font-size: 22px; margin-right: 4px; font-variant-numeric: tabular-nums; }
.hist-item.prog > span { flex-basis: 100%; }
.hist-item.fait { opacity: .6; }
.next { color: var(--lane); font-weight: 700; }
details.dossier { border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
details.dossier summary { font-family: var(--font-display); font-weight: 700; font-size: 20px; min-height: 40px; cursor: pointer; }
details.dossier[open] summary { margin-bottom: 10px; }
details.dossier summary small { font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--muted); }
/* v30 (point 5) : onglets de l'écran Compétition, barre « Retour à la course », jours de l'historique */
.onglets button { font-size: 19px; }
.retour-course { position: sticky; top: 0; z-index: 5; width: 100%; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.retour-course small { display: block; font-family: var(--font-body); font-size: 15px; letter-spacing: 0; text-transform: none; }
@media (max-width: 600px) { .onglets { gap: 4px; flex-wrap: nowrap; } .onglets button { min-width: 0; flex: 1 1 auto; font-size: 15px; padding: 4px 6px; } .btn.big.retour-course { font-size: 17px; padding: 6px 10px; letter-spacing: .02em; } }
details.jour-d { margin-top: 6px; }
details.jour-d > summary { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-height: 40px; cursor: pointer; }
details.jour-d > summary small { font-family: var(--font-body); font-size: 14px; text-transform: none; letter-spacing: 0; }
details.jour-d[open] > summary { margin-bottom: 8px; }
.nag.exclu { opacity: .65; border-style: dashed; }
#ns { position: fixed; left: 0; right: 0; top: 0; z-index: 40; background: var(--start); color: var(--start-ink); font-weight: 700; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; text-align: center; }
.fin-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 6px 0; }
.fin-row .btn { min-width: 52px; }
.fin-row b { flex: 1 1 160px; }
.fin-row select { border: 2px solid var(--line); border-radius: 8px; min-height: 48px; padding: 6px 10px; background: var(--surface); }
details.nons { border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
details.nons summary { font-weight: 600; min-height: 32px; cursor: pointer; }
details.nons[open] summary { margin-bottom: 10px; }

/* Écran Course : bandeau, gros Départ, une tuile par nageur rangée par couloir, pavé CB docké en bas */
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
.bar .btn { min-height: 48px; padding: 6px 14px; }
.titre { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2.6vw, 26px); line-height: 1.1; }
.titre small { display: block; font-weight: 600; font-size: .7em; color: var(--muted); }
.b1 { flex: 1 1 360px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.b2 { display: flex; gap: 8px; align-items: center; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
.btn.undo { font-family: var(--font-display); font-size: 24px; font-weight: 700; padding: 6px 22px; min-height: 56px; }
.depart { border: 0; border-radius: 14px; background: var(--start); color: var(--start-ink); font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 7vw, 64px); letter-spacing: .08em; min-height: clamp(84px, 14vh, 140px); touch-action: none; }
.depart small { display: block; font-size: 16px; font-family: var(--font-body); font-weight: 600; letter-spacing: 0; }
.grid { flex: 1; min-height: 0; display: grid; gap: 8px; }
.card { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 0; container-type: inline-size; }
.tile {
  flex: 1; min-height: 0; position: relative; border: 4px solid var(--lane); background: var(--surface); border-radius: 12px;
  padding: 6px 10px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; touch-action: none;
  container-type: size; /* le texte se règle sur la taille de la tuile */
}
.t-top { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: clamp(16px, min(15cqh, 13cqw), 40px); line-height: 1.1; white-space: nowrap; overflow: hidden; }
.t-top .cl { background: var(--lane); color: var(--lane-ink); border-radius: 6px; padding: 0 .3em; flex-shrink: 0; }
.t-top b { overflow: hidden; text-overflow: ellipsis; }
.t-len { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, min(13cqh, 11cqw), 34px); line-height: 1.1; color: var(--lane); white-space: nowrap; overflow: hidden; }
.t-split { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, min(30cqh, 24cqw), 110px); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-cum, .t-run { font-size: clamp(12px, min(9cqh, 8cqw), 24px); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.t-cum { font-weight: 600; }
.t-run { color: var(--muted); }
.tile.down { background: var(--wait); }
.tile.tapok { background: var(--lane) !important; color: var(--lane-ink) !important; }
.tile.tapok .t-len, .tile.tapok .t-run { color: var(--lane-ink) !important; }
.tile.refus { background: var(--warn) !important; border-color: var(--warn) !important; color: #fff !important; }
.tile.refus .t-len, .tile.refus .t-run { color: #fff !important; }
.tile.fini { background: var(--wall); border-color: var(--wall); color: var(--wall-ink); }
.tile.fini .t-len, .tile.fini .t-run { color: var(--wall-muted); }
.tile.ab { background: var(--done); border-style: dashed; border-color: var(--line); color: var(--muted); }
.tile.ab .t-len { color: var(--warn); }
.tile.avant { border-style: dashed; }
/* Sous la tuile : 5 coulées + CB. Ce sont des boutons à part : jamais un tap mur. */
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
@container (min-width: 380px) { .strip { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.cou { min-height: 52px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); font-family: var(--font-display); font-weight: 700; font-size: 22px; padding: 0; touch-action: none; }
.cou.on { background: var(--nage); color: var(--nage-ink); border-color: var(--nage); }
.cou.cbb { border-color: var(--cbq); color: var(--cbq); }
.cou.cbb.on { background: var(--cbq); color: var(--cbq-ink); }
.cou:disabled { opacity: .3; }
.grid.dense .cou { min-height: 44px; font-size: 18px; }
/* Vue côté du bassin = une ligne d'eau par nageur (retour iPad du 20/11).
   Plots de départ d'un côté (avec le bloc du nageur et son bouton CB), mur d'en face de l'autre.
   Coulées posées à leur vraie distance du mur qu'il vient de quitter ; zone « mur » (split) entre 15 m et le mur d'arrivée.
   À chaque virage, tout s'inverse. */
.grid.cote .card { flex-direction: row; gap: 6px; }
.grid.cote.plots-d .card { flex-direction: row-reverse; }
.plot { flex: 0 0 clamp(92px, 15%, 170px); display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-width: 0;
  background: var(--surface); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 8px; box-sizing: border-box; container-type: size; overflow: hidden; }
.plot .t-top { font-size: clamp(14px, min(22cqh, 15cqw), 30px); }
.plot .t-top b { white-space: nowrap; }
.plot .t-len { font-size: clamp(12px, min(17cqh, 12cqw), 24px); white-space: normal; line-height: 1.15; }
.plot .cbb { min-height: 36px; flex: 1 1 auto; max-height: 64px; font-size: clamp(16px, 20cqh, 24px); }
.eau { flex: 1; min-width: 0; position: relative; border-radius: 10px; overflow: hidden;
  background: linear-gradient(to bottom, transparent calc(50% - 1px), var(--line) calc(50% - 1px), var(--line) calc(50% + 1px), transparent calc(50% + 1px)), var(--wait); }
.eau .cou.flot { position: absolute; width: var(--bw, 52px); height: calc(50% - 6px); min-height: 0; padding: 0; z-index: 2; }
.eau .cou.flot.ra { top: 4px; } .eau .cou.flot.rb { bottom: 4px; }
.eau .tile { position: absolute; top: 0; bottom: 0; border-radius: 10px; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; padding: 4px 8px; text-align: center; }
.eau .tile .t-split { font-size: clamp(20px, min(48cqh, 22cqw), 96px); }
.eau .tile .t-cum, .eau .tile .t-run { font-size: clamp(11px, min(15cqh, 9cqw), 22px); max-width: 100%; }
.eau .tile.fini, .eau .tile.ab { left: 0 !important; right: 0 !important; }
.depart.vert { writing-mode: vertical-rl; transform: rotate(180deg); min-height: 0; flex: 0 0 clamp(64px, 9vw, 120px); font-size: clamp(30px, 5vw, 56px); }
.grid.cote.plots-d + .depart.vert, .depart.vert.d { transform: none; }
.zone { flex: 1; min-height: 0; display: flex; gap: 8px; }
.zone.d { flex-direction: row-reverse; }
.zone > .grid { flex: 1; min-width: 0; }
.grid.cote.dense .plot { padding: 3px 6px; border-width: 2px; }
.grid.cote.dense .plot { gap: 2px; } .grid.cote.dense .plot .cbb { min-height: 24px; font-size: 15px; } .grid.cote.dense .plot .t-len { font-size: clamp(11px, 13cqh, 16px); }
.vues-plots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vues-plots .choix button { font-size: 18px; }
.vues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.vues button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
.vues button.on { border: 3px solid var(--lane); background: var(--bg); }
.vues .schema { display: grid; gap: 3px; width: 90px; height: 54px; }
.vues .schema i { background: var(--lane); color: var(--lane-ink); border-radius: 3px; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.grid.dense .tile { padding: 4px 6px; border-width: 3px; }
.pad { border: 3px solid var(--cbq); background: var(--surface); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.pad-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pad-head b { font-family: var(--font-display); font-size: 24px; }
.pad-head span { color: var(--muted); flex: 1; }
.pad-head .btn { min-height: 44px; padding: 6px 14px; }
.pad-lens { display: flex; gap: 6px; flex-wrap: wrap; }
.pad-len { border: 2px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 52px; min-height: 48px; padding: 2px 8px; display: flex; flex-direction: column; align-items: center; touch-action: none; }
.pad-len small { color: var(--muted); font-size: 11px; }
.pad-len b { font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
.pad-len.on { border-color: var(--cbq); border-width: 3px; background: var(--surface); }
.pad-keys { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 6px; }
.pad-key.go { grid-column: span 2; font-size: 22px; }
.pad-key.go.attend { box-shadow: 0 0 0 4px var(--hot); }
.pad-key { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; min-height: 56px; font-family: var(--font-display); font-weight: 700; font-size: 28px; touch-action: none; padding: 0; }
.pad-key.go { background: var(--cbq); color: var(--cbq-ink); border-color: var(--cbq); }
@media (max-width: 700px) { .pad-keys { grid-template-columns: repeat(7, minmax(0, 1fr)); } .pad-key { min-height: 50px; } }
/* iPhone tenu debout : bandeau sur deux rangées, pavé plus serré, pour laisser la place aux tuiles */
@media (max-width: 600px) {
  .b2 { flex-basis: 100%; } .b2 .btn { flex: 1; } .b2 .btn.undo { flex: 2; } .b2 .long { display: none; }
  .titre { font-size: 17px; } .clock { font-size: 34px; }
  .bar .btn { min-height: 46px; padding: 4px 10px; }
  .grid { gap: 6px; } .card { gap: 3px; } .strip { gap: 3px; }
  .cou { min-height: 46px; font-size: 20px; }
  .pad { padding: 6px; gap: 4px; }
  .pad-head { gap: 6px; } .pad-head b { font-size: 20px; } .pad-head span { font-size: 12px; line-height: 1.2; }
  .pad-head .btn { min-height: 40px; padding: 4px 10px; }
  .pad-len { min-height: 40px; min-width: 44px; } .pad-len b { font-size: 18px; }
  .pad-key { min-height: 46px; }
}

/* Récap */
.nag { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.nag-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-display); font-weight: 700; font-size: 26px; }
.nag-head .cl { background: var(--lane); color: var(--lane-ink); border-radius: 6px; padding: 0 .3em; }
.nag-head select { font-family: var(--font-body); font-weight: 600; border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 44px; }
.alerte { background: var(--hot); color: var(--hot-ink); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td input, td select { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 44px; box-sizing: border-box; width: 104px; -webkit-user-select: text; user-select: text; text-align: right; }
td input.cbi { width: 64px; }
td select { width: 84px; }
td.manque { color: var(--warn); font-weight: 600; }
td .mini { min-height: 40px; padding: 4px 8px; font-size: 13px; }
textarea { width: 100%; min-height: 70px; resize: vertical; }

.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 18px; width: min(560px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow-y: auto; box-sizing: border-box; }
.trow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.trow b { flex: 1 1 140px; font-family: var(--font-display); font-size: 22px; }
.trow .choix button { font-size: 18px; min-height: 48px; }
/* Message en haut, et transparent au toucher : il ne doit jamais avaler un mur tapé dessous */
.toast { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: 90vw; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="ns" hidden></div>

<script>
const APP_VERSION = 'v30';
const KEY_COURSES = 'chrono-courses';   // { ouvertes: [course], hist: [course], prefs: { vue } } — à part des séries d'entraînement
const KEY_PLAN = 'chrono-plan';         // lecture seule : nageurs chargés par l'entraînement
const KEY_SON = 'chrono-son';           // lecture seule : son réglé dans l'entraînement
const NAGES = ['NL', 'Dos', 'Brasse', 'Pap', '4N'];
const ORDRE_4N = ['Pap', 'Dos', 'Brasse', 'NL'];
const COULEES = ['-5', '+5', '+7', '+10', '+14'];  // stockées en texte, exactement
const DISTANCES = [25, 50, 100, 200, 400, 800, 1500];
const S_PAR_M = 0.36;      // anti-goutte : pas deux murs à moins de 0,36 s/m × bassin (9" en 25 m)
const CANCEL_MS = 900;     // toucher annulé par l'iPad : reste un tap s'il était bref
const ROUVRIR_MS = 15 * 60000;

// ---------- Outils (recopiés d'index.html) ----------
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt(sec, dec = 2) {
  if (sec == null) return '';
  const neg = sec < 0; sec = Math.abs(sec);
  const u = 10 ** dec, t = Math.round(sec * u), m = Math.floor(t / (60 * u)), rest = t - m * 60 * u;
  const ss = Math.floor(rest / u), frac = String(rest % u).padStart(dec, '0');
  return (neg ? '−' : '') + (m ? `${m}'${String(ss).padStart(2, '0')}"${frac}` : `${ss}"${frac}`);
}
function fmtEdit(sec) { const m = Math.floor(sec / 60), s = (sec - m * 60).toFixed(2); return m ? `${m}:${s.padStart(5, '0')}` : s; }
function parseTime(str) {
  str = String(str).trim().replace(',', '.').replace(/"/g, '.').replace(/'/g, ':');
  if (!str) return null;
  const p = str.split(':');
  const v = p.length === 2 ? Number(p[0]) * 60 + Number(p[1]) : Number(p[0]);
  return Number.isFinite(v) && v > 0 ? v : null;
}
function ecrire(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function getLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function fmtDate(ts) { return new Date(ts).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function fmtEcart(d) { return (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(2).replace('.', ',') + '"'; }
function armed(btn, confirmLabel, action) {
  const label = btn.textContent;
  btn.onclick = () => {
    if (btn.dataset.armed) { action(); return; }
    btn.dataset.armed = '1'; btn.textContent = confirmLabel;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; } }, 4000);
  };
}
function toast(msg, ms = 2200) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms);
}
let audio = null;
function bip(freq = 1000, duree = 0.07) {
  if (getLS(KEY_SON) === '0') return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; g.gain.value = 0.25;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + duree);
  } catch (e) {}
}
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function lacherEcran() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && C && !C.done && C.T0 != null) keepAwake(); });

// Principe de bindPress (index.html) : l'instant du toucher (pointerdown) fait foi, le doigt est capturé par l'élément,
// l'action part au relâcher ; un toucher annulé par l'iPad (geste système) reste une action s'il était bref.
// Chaque doigt est suivi à part : deux doigts sur deux tuiles = deux murs, jamais mélangés.
const presses = new Map();
function bindPress(el, action) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const t = Date.now();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    presses.set(e.pointerId, { el, t, action });
    el.classList.add('down');
  });
  const fin = (e, commit) => {
    const p = presses.get(e.pointerId); if (!p || p.el !== el) return;
    presses.delete(e.pointerId); el.classList.remove('down');
    if (commit || Date.now() - p.t < CANCEL_MS) p.action(p.t);
  };
  el.addEventListener('pointerup', e => fin(e, true));
  el.addEventListener('pointercancel', e => fin(e, false));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

// ---------- Données ----------
let dernierEcrit = null;   // le texte que cette page a écrit (ou lu) en dernier dans la mémoire principale
function chargerDB() {
  try {
    const brut = localStorage.getItem(KEY_COURSES);
    const d = JSON.parse(brut);
    if (d && Array.isArray(d.ouvertes) && Array.isArray(d.hist)) { dernierEcrit = brut; return Object.assign({ prefs: {} }, d); }
  } catch (e) {}
  return { ouvertes: [], hist: [], prefs: {} };
}
let DB = chargerDB();
let C = null;            // course affichée
let view = 'accueil';    // accueil | course | recap
const RT = { pad: null, form: null };  // jamais sauvegardé : pavé CB ouvert, formulaire en cours
// v25 (retour des Départementaux du 21/11 : courses perdues sur l'iPad). Trois copies de chaque geste :
//  1) la mémoire principale de l'app (localStorage), 2) une copie de secours sur l'iPad (IndexedDB, autre réserve de place),
//  3) une copie au Sheet (onglet Sauvegarde_courses) dès qu'une course est nagée et qu'il y a du réseau.
// Si la 1re échoue, un bandeau rouge reste affiché (avant : un message de 7 s, facile à manquer).
// v26 (retour du 22/11) : les copies ne s'écrasent plus, elles se complètent course par course.
//  - chaque course porte un compteur `ver` (+1 à chaque vrai changement de cette course, détecté tout seul) et `maj` ;
//  - avant d'écrire, on relit la mémoire : si quelqu'un d'autre (autre onglet, ancienne page) y a écrit, on fusionne d'abord ;
//  - une course terminée ne redevient jamais « pas finie » par une copie : seul « Rouvrir » (ou ↶ Annuler) le fait, et c'est daté ;
//  - une course supprimée exprès (Supprimer) est notée dans DB.supprimees et ne revient d'aucune copie.
let nonSauve = false;
const META = new Set(['maj', 'ver', 'sauveAt']);   // ce qui ne compte pas comme un changement de la course
const empreinte = c => JSON.stringify(c, (k, x) => META.has(k) ? undefined : x);
const empreintes = new Map();
const toutesCourses = d => [...(d.ouvertes || []), ...(d.hist || [])];
toutesCourses(DB).forEach(c => empreintes.set(c.uid, empreinte(c)));   // état au lancement : rien n'a encore changé
function marquerChangements() {
  const t = Date.now();
  toutesCourses(DB).forEach(c => { const e = empreinte(c); if (empreintes.get(c.uid) !== e) { c.ver = (c.ver || 0) + 1; c.maj = t; empreintes.set(c.uid, e); } });
}
// Entre deux versions d'une même course, laquelle garder ?
function gagnante(a, b) {
  if (!!a.done !== !!b.done) {
    const f = a.done ? a : b, o = a.done ? b : a;
    if (!((o.rouvertAt || 0) > (f.endedAt || 0))) return f;   // pas rouverte exprès après la fin : la terminée gagne
  }
  if ((a.ver || 0) !== (b.ver || 0)) return (a.ver || 0) > (b.ver || 0) ? a : b;
  return (b.maj || 0) > (a.maj || 0) ? b : a;
}
// Fusionne une autre copie (mémoire principale relue, copie de secours, Sheet) dans DB, sans jamais rien perdre.
// Renvoie le nombre de courses ajoutées ou remplacées par une version plus avancée.
function fusionner(autre) {
  if (!autre) return 0;
  const supp = new Set([...(DB.supprimees || []), ...(autre.supprimees || [])]);
  const ici = new Map(toutesCourses(DB).map(c => [c.uid, c]));
  let n = 0;
  toutesCourses(autre).forEach(x => {
    if (!x || !x.uid || supp.has(x.uid) || !Array.isArray(x.nageurs)) return;
    const loc = ici.get(x.uid);
    if (loc && (gagnante(loc, x) === loc || empreinte(loc) === empreinte(x))) return;
    ici.set(x.uid, x); empreintes.set(x.uid, empreinte(x)); n++;
  });
  const avant = toutesCourses(DB).length;
  if (n || supp.size !== (DB.supprimees || []).length) {
    const garde = c => !supp.has(c.uid);
    const ordre = [...toutesCourses(DB).map(c => c.uid), ...[...ici.keys()]].filter((u, i, a) => a.indexOf(u) === i);
    const liste = ordre.map(u => ici.get(u)).filter(garde);
    DB.ouvertes = liste.filter(c => !c.done);
    DB.hist = liste.filter(c => c.done).sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));
    DB.supprimees = [...supp];
    if (C) C = ici.get(C.uid) && garde(C) ? ici.get(C.uid) : null;
  }
  if (autre.prog && (!DB.prog || (autre.prog.maj || autre.prog.chargeLe || 0) > (DB.prog.maj || DB.prog.chargeLe || 0))) { DB.prog = autre.prog; n++; }
  DB.rev = Math.max(DB.rev || 0, autre.rev || 0);
  if ((autre.sauveAt || 0) > (DB.sauveAt || 0)) DB.sauveAt = autre.sauveAt;
  return n + Math.max(0, avant - toutesCourses(DB).length);
}
// La mémoire principale a-t-elle été écrite par quelqu'un d'autre depuis notre dernière écriture ? On la reprend (fusion).
function relireMemoire() {
  const brut = getLS(KEY_COURSES);
  if (!brut || brut === dernierEcrit) return 0;
  try { const s = JSON.parse(brut); if (s && Array.isArray(s.hist)) { dernierEcrit = brut; return fusionner(s); } } catch (e) {}
  return 0;
}
function save() {
  marquerChangements();
  relireMemoire();
  DB.rev = (DB.rev || 0) + 1; DB.savedAt = Date.now();
  let json = JSON.stringify(DB);
  copieSecours(json);
  let ok = ecrireTexte(json);
  if (!ok) { faireDeLaPlace(); json = JSON.stringify(DB); ok = ecrireTexte(json); }
  if (ok) dernierEcrit = json;
  nonSauve = !ok; majBandeau();
  return ok;
}
function ecrireTexte(json) { try { localStorage.setItem(KEY_COURSES, json); return true; } catch (e) { return false; } }
// Mémoire pleine : on retire ce qui ne sert plus (piles « Annuler » des courses finies depuis plus de 15 min).
function faireDeLaPlace() { DB.hist.forEach(c => { if (c.undo && c.undo.length && Date.now() - (c.endedAt || 0) > ROUVRIR_MS) c.undo = []; }); }
function majBandeau() {
  const b = document.getElementById('ns'); if (!b) return;
  b.hidden = !nonSauve;
  b.textContent = '⚠ Mémoire de l\'iPad pleine : courses gardées dans la copie de secours. Ne ferme pas l\'app ; envoie les courses au Sheet dès que possible.';
}
const IDB_NOM = 'chrono-secours', IDB_STORE = 'copies';
let idbP = null;
function idb() {
  return idbP = idbP || new Promise((res, rej) => {
    try { const r = indexedDB.open(IDB_NOM, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
}
function copieSecours(json) {
  json = json || JSON.stringify(DB);
  idb().then(d => { d.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(json, 'courses'); }).catch(() => {});
}
async function lireSecours() {
  try {
    const d = await idb();
    return await new Promise(res => { const r = d.transaction(IDB_STORE).objectStore(IDB_STORE).get('courses'); r.onsuccess = () => { try { res(r.result ? JSON.parse(r.result) : null); } catch (e) { res(null); } }; r.onerror = () => res(null); });
  } catch (e) { return null; }
}
// L'app tourne-t-elle dans Safari au lieu de l'icône installée ? (sur iPad, les deux ont des mémoires séparées)
const surIOS = /iPad|iPhone/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const horsApp = surIOS && !(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const PLAN = (() => { try { return JSON.parse(getLS(KEY_PLAN)); } catch (e) { return null; } })();
const actif = n => n.actif !== false && String(n.actif).toUpperCase() !== 'FALSE';
const NAGEURS = (PLAN && PLAN.nageurs || []).filter(actif);

// Pas des temps (21/11, demande de Sam) : en 25 m, dès le 200, un mur tous les 50 m (un « segment » = 50 m).
// Tout le moteur compte en segments : un segment = une longueur quand le pas = le bassin.
const pasDe = c => c.pas || c.bassin;
const pasDefaut = (distance, bassin) => bassin === 25 && distance >= 200 ? 50 : bassin;
const pasPossibles = (distance, bassin, nage) => [...new Set([bassin, 50, 100])].filter(p => p >= bassin && p % bassin === 0 && distance % p === 0
  && (nage !== '4N' || (distance / p) % 4 === 0));
// v27 (retour du 21/11 : changer la prise 25 / 50 m PENDANT une course) : chaque nageur a la liste des distances où un temps
// est pris (s.pts, en m). Les temps tombent sur des repères ronds (multiples du pas) ; changer le pas en course refait la liste
// à partir du dernier mur tapé. Sans s.pts (courses d'avant la v27, ou pas jamais changé en course) : la liste vient de c.pas.
// « Segment » k (1 à nbP) = de debP à ptsDe[k-1] ; coulée et CB sont rangés par segment, comme avant.
function grillePts(c, depuis, pas) {
  const a = []; for (let m = (Math.floor(depuis / pas) + 1) * pas; m < c.distance; m += pas) a.push(m);
  a.push(c.distance); return a;
}
const ptsDe = (c, s) => s.pts || grillePts(c, 0, pasDe(c));
const nbP = (c, s) => ptsDe(c, s).length;
const debP = (c, s, k) => k > 1 ? ptsDe(c, s)[k - 2] : 0;
const lgP = (c, s, k) => ptsDe(c, s)[k - 1] - debP(c, s, k);
const enLongueurs = (c, s) => ptsDe(c, s).every((m, k) => m === (k + 1) * c.bassin);
const libP = (c, s, k) => enLongueurs(c, s) ? `L${k}` : `${ptsDe(c, s)[k - 1]} m`;   // « L3 », ou « 150 m » quand le pas n'est pas le bassin
const nageP = (c, s, k) => c.nage === '4N' ? ORDRE_4N[Math.floor(debP(c, s, k) * 4 / c.distance)] : c.nage;
const pasUnique = c => c.nageurs.every(s => !s.pts);
const rappelCB = n => n === 'NL' || n === 'Dos' ? 'chaque bras' : 'le cycle';
const prenom = s => s.prenom || s.nom;
const nomComplet = s => s.prenom ? `${s.prenom} ${s.nom}` : s.nom;
const coulTxt = v => v == null ? '' : String(v).replace('-', '−');
function nomCourse(c) { return `${c.distance} ${c.nage}${c.sexe ? ' ' + (SEXE[c.sexe] || '') : ''}${c.tour && c.tour !== 'Séries' ? ' · ' + c.tour : ''} · ${c.bassin} m${c.serie ? ' · série ' + c.serie : ''}`; }
const fini = (c, s) => s.murs.length >= nbP(c, s);
const enCourse = (c, s) => !fini(c, s) && s.statut !== 'abandon';
const toutFini = c => c.nageurs.every(s => !enCourse(c, s));
// Longueur en cours (pour la coulée) : celle qui vient de commencer (départ plongé, puis après chaque virage).
const lEnCours = (c, s) => Math.min(nbP(c, s), s.murs.length + 1);

// Temps de passage (cumuls) mesurés, en secondes ; une correction du récap remplace la lecture des taps, qui restent gardés.
function cumuls(c, s) {
  if (s.cumuls) return s.cumuls.slice();
  return Array.from({ length: nbP(c, s) }, (_, k) => s.murs[k] != null && c.T0 != null ? (s.murs[k] - c.T0) / 1000 : null);
}
function ecart(c, s) { const f = cumuls(c, s)[nbP(c, s) - 1]; return s.officiel != null && f != null ? s.officiel - f : null; }
function cumulsRecales(c, s) { const e = ecart(c, s) || 0; return cumuls(c, s).map(v => v == null ? null : v + e); }
function splits(arr) { return arr.map((v, k) => v == null ? null : k === 0 ? v : arr[k - 1] == null ? null : v - arr[k - 1]); }
function statutAuto(c, s) { return cumuls(c, s).every(v => v != null) ? 'ok' : 'manque'; }
function statut(c, s) { return s.statut || statutAuto(c, s); }

// ---------- Gestes (chacun s'annule avec ↶ Annuler, Départ compris) ----------
function pushUndo(e) { C.undo.push(e); }
function libelleGeste(e) {
  const s = C.nageurs[e.i];
  if (e.t === 'depart') return 'Départ';
  if (e.t === 'mur') return `mur de ${prenom(s)} (${libP(C, s, s.murs.length)})`;
  if (e.t === 'coulee') return `coulée de ${prenom(s)} (${libP(C, s, e.L)})`;
  if (e.t === 'cb') return `CB de ${prenom(s)} (${libP(C, s, e.L)})`;
  if (e.t === 'pas') return `temps tous les ${pasDe(C)} m`;
  if (e.t === 'statut') return `statut de ${prenom(s)}`;
  return 'geste';
}
function depart(t) {
  const c = C; if (!c || c.done || c.T0 != null) return;
  c.T0 = t; pushUndo({ t: 'depart' }); save();
  bip(1200, 0.15); keepAwake(); renderCourse();
}
function mur(i, t) {
  const c = C; if (!c || c.done) return;
  const s = c.nageurs[i];
  if (c.T0 == null) { refus(i); toast('Touche d\'abord DÉPART, au signal'); return; }
  if (s.statut === 'abandon') { toast(`${prenom(s)} : abandon`); return; }
  if (fini(c, s)) { validerChiffre(); toast(`${prenom(s)} a fini`); return; }
  validerChiffre();
  const prev = s.murs.length ? s.murs[s.murs.length - 1] : c.T0;
  if (t - prev < S_PAR_M * lgP(c, s, s.murs.length + 1) * 1000) { refus(i); bip(220, 0.25); return; } // goutte d'eau : rien d'enregistré
  s.murs.push(t); pushUndo({ t: 'mur', i }); save();
  bip(1000, 0.07); flash(i, 'tapok');
  if (toutFini(c)) { finir(true); return; }
  majCourse();
}
function coulee(i, v) {
  const c = C; if (!c || c.done) return;
  const s = c.nageurs[i]; if (!enCourse(c, s)) return;
  validerChiffre();
  const L = lEnCours(c, s), avant = s.coulees[L] ?? null;
  if (avant === v) delete s.coulees[L]; else s.coulees[L] = v;   // 2e toucher sur le même = efface
  pushUndo({ t: 'coulee', i, L, avant }); save(); majCourse();
}
function cbValeur(v) {
  const c = C, p = RT.pad; if (!c || (c.done && !saisieFin(c)) || !p) return;
  const s = c.nageurs[p.i], L = p.L, avant = s.cb[L] ?? null;
  if (v == null) delete s.cb[L]; else s.cb[L] = String(Number(v));
  pushUndo({ t: 'cb', i: p.i, L, avant }); save();
  if (v != null) p.L = Math.min(nbP(c, s), L + 1);
  p.buf = ''; majCourse();
}
function setStatut(i, v) {
  const c = C; if (!c || c.done) return;
  const s = c.nageurs[i]; if ((s.statut || null) === v) return;
  validerChiffre();
  pushUndo({ t: 'statut', i, avant: s.statut || null });
  s.statut = v; save();
  if (toutFini(c) && c.T0 != null) { fermerLayer(); finir(true); return; }
  majCourse();
}
// v27 : ⏱ change le pas à tout moment. Avant le DÉPART : pour toute la course. Pendant : pour chaque nageur encore dans l'eau,
// à partir de son prochain mur (repères ronds : passer à 50 m à 75 m → prochain temps à 100 m). C'est un geste : ↶ Annuler le défait.
function changerPas() {
  const c = C; if (!c || c.done) return;
  const ps = pasPossibles(c.distance, c.bassin, c.nage); if (ps.length < 2) return;
  // Avant le départ : on fait le tour (25 → 50 → 100…). Pendant : un seul toucher pour le changement courant,
  // 25 ↔ 50 m (et 100 → 50), sans passer par 100 m en pleine course.
  const k = ps.indexOf(pasDe(c));
  const nv = c.T0 == null ? ps[(k + 1) % ps.length] : k > 0 ? ps[k - 1] : ps[1];
  validerChiffre();
  if (c.T0 == null) { c.pas = nv; c.nageurs.forEach(s => delete s.pts); RT.pad = null; save(); toast(`Temps pris tous les ${nv} m`); renderCourse(); return; }
  pushUndo({ t: 'pas', avant: c.pas ?? null, pts: c.nageurs.map(s => s.pts ? s.pts.slice() : null) });

// ---------- Programme de compétition (C3a) : engagements du club lus sur liveFFN par le script du Sheet ----------
// DB.prog = { lien, id_compet, competition, lieu, dates, bassin, chargeLe, lignes: [une ligne par engagement] }
// Une course du programme = épreuve + tour + série ; elle ne garde que les nageurs suivis (tes groupes), rangés par couloir.
const SEXE = { F: 'D', M: 'M', X: 'mixte' };

const keyChoix = l => [l.nageur_liveffn, l.distance, l.nage, l.sexe, l.tour].join('|');   // garde « suivre » d'un chargement à l'autre
function coursesProgramme() {
  const P = DB.prog; if (!P) return [];
  const par = {};
  P.lignes.forEach(l => { const k = keyCourse(l); (par[k] = par[k] || { id: k, lignes: [] }).lignes.push(l); });
  return Object.values(par).map(g => {
    const l = g.lignes[0];
    return Object.assign(g, { date: l.date, heure: l.heure, jour: l.jour, distance: Number(l.distance), nage: l.nage, sexe: l.sexe, tour: l.tour,
      serie: String(l.serie), num_epreuve: l.num_epreuve, suivis: g.lignes.filter(x => x.suivi).sort((a, b) => a.couloir - b.couloir) });
  }).sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure) || a.serie - b.serie);
}
// v26 (retour du 22/11 : liveFFN avait recomposé des séries ; après rechargement, les courses nagées réapparaissaient
// « à venir »). Une course est reliée au programme par la COMPÉTITION + l'ÉPREUVE (distance, nage, sexe, tour) + le NAGEUR,
// jamais par le n° de série ni par l'heure : si liveFFN change la série ou le couloir, la course nagée reste nagée.
const normTour = t => t && t !== 'Séries' ? String(t).replace(/\s+/g, ' ').trim() : 'Séries';
const cleEpC = c => [String(c.idCompet), Number(c.distance), c.nage, c.sexe || '', normTour(c.tour)].join('|');
const cleEpG = g => [String(g.lignes[0].id_compet), Number(g.distance), g.nage, g.sexe || '', normTour(g.tour)].join('|');
const normNom = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
const nomDeLigne = l => normNom(String(l.prenom || l.nageur || '') + String(l.nom || ''));
const memeNageur = (s, l) => (s.id_nageur && l.id_nageur && String(s.id_nageur) === String(l.id_nageur))
  || (!!nomDeLigne(l) && normNom(String(s.prenom || '') + String(s.nom || '')) === nomDeLigne(l));

const coursesDe = (g, l) => toutesCourses(DB).filter(c => c.idCompet != null && cleEpC(c) === cleEpG(g) && c.nageurs.some(s => memeNageur(s, l)));
const parti = c => c.done || c.T0 != null;
// État d'une ligne du programme : il ne dépend que de ce qui a été chronométré (jamais de l'heure).
function etatProg(g) {
  const par = g.suivis.map(l => coursesDe(g, l));
  const faites = par.map(cs => cs.find(parti) || null);   // course partie ou finie, pour chaque nageur suivi
  const enCours = faites.find(c => c && !c.done);
  if (enCours) return { t: 'en cours', fait: false, c: enCours };
  if (faites.length && faites.every(Boolean)) {
    const cs = [...new Set(faites)];
    const t = cs.some(c => !c.validee && !c.sentAt) ? 'à valider' : cs.some(c => !c.sentAt) ? 'validée · envoi en attente' : 'envoyée ✓';
    const autreSerie = cs.filter(c => String(c.serie) !== String(g.serie)).map(c => c.serie);
    return { t: t + (autreSerie.length ? ` · nagée en série ${[...new Set(autreSerie)].join(', ')}` : ''), fait: true, c: cs[0] };
  }
  const prete = par.flat().find(c => !parti(c));
  if (prete) return { t: 'prête', fait: false, c: prete };
  const deja = g.suivis.filter((l, k) => faites[k]);
  return { t: 'à venir' + (deja.length ? ` · déjà nagé : ${deja.map(l => l.prenom || l.nageur).join(', ')}` : ''), fait: false,
    restants: g.suivis.filter((l, k) => !faites[k]) };

const nomEpreuve = g => `${g.distance} ${g.nage} ${SEXE[g.sexe] || ''}`.trim() + (g.tour && g.tour !== 'Séries' ? ' · ' + g.tour : '');
async function chargerProgramme(lien) {

  if (navigator.onLine === false) { toast('Pas de réseau : le programme se charge avec du wifi ou la 4G', 4000); return; }
  toast('Lecture de liveFFN par le Sheet…', 15000);

  catch (e) { toast(e.message, 5000); return; }

  const choix = {}, nums = {};
  const cleEp = l => [l.distance, l.nage, l.sexe, l.tour].join('|');
  if (avant) avant.lignes.forEach(l => { if (l.suiviMain) choix[keyChoix(l)] = l.suivi; if (l.num_epreuve) nums[cleEp(l)] = l.num_epreuve; });

    const x = Object.assign({}, l, { serie: String(l.serie), couloir: Number(l.couloir), engagement_s: l.engagement_s === '' ? null : Number(l.engagement_s), suivi: l.suivi === true || String(l.suivi).toUpperCase() === 'TRUE' });
    if (keyChoix(x) in choix) { x.suivi = choix[keyChoix(x)]; x.suiviMain = true; }
    if (!x.num_epreuve && nums[cleEp(x)]) x.num_epreuve = nums[cleEp(x)];   // page « Épreuves » pas lue cette fois : on garde les n° d'avant
    return x;
  });
  const anciensIds = new Set(coursesProgramme().map(g => g.id));
  DB.prog = { lien, id_compet: String(r.id_compet), competition: r.competition, lieu: r.lieu, dates: r.dates, bassin: Number(r.bassin_m) || 25, chargeLe: Date.now(), maj: Date.now(), lignes };
  DB.prog.changements = avant ? changementsProgramme(avant, anciensIds) : [];

  const nCh = DB.prog.changements.length;

  if (view === 'accueil') render();
}
// v26 : après un rechargement, ce qui a changé sur liveFFN pour tes nageurs suivis. Les courses parties ou nagées ne
// bougent jamais ; une course seulement préparée (pas de DÉPART) dont la série, les couloirs ou les nageurs ont changé
// est retirée : la toucher dans le programme la prépare à neuf, à jour.
function changementsProgramme(avant, anciensIds) {
  const out = [], P = DB.prog, G = coursesProgramme();
  const ep = l => `${l.distance} ${l.nage} ${SEXE[l.sexe] || ''}`.trim() + (normTour(l.tour) !== 'Séries' ? ' · ' + l.tour : '');
  const cle = l => [l.nageur_liveffn || l.nageur, l.distance, l.nage, l.sexe, normTour(l.tour)].join('|');
  const vieux = new Map(avant.lignes.filter(l => l.suivi).map(l => [cle(l), l]));
  P.lignes.filter(l => l.suivi).forEach(l => {
    const a = vieux.get(cle(l)); vieux.delete(cle(l));
    const g = G.find(x => x.lignes.includes(l));
    const nage = g && coursesDe(g, l).some(parti);
    if (!a) { out.push(`${l.prenom || l.nageur} · ${ep(l)} : nouvel engagement (série ${l.serie}, couloir ${l.couloir})`); return; }
    const d = [];
    if (String(a.serie) !== String(l.serie)) d.push(`série ${a.serie} → ${l.serie}`);
    if (Number(a.couloir) !== Number(l.couloir)) d.push(`couloir ${a.couloir} → ${l.couloir}`);
    if ((a.heure || '') !== (l.heure || '')) d.push(`${a.heure || '?'} → ${l.heure || '?'}`);
    if (d.length) out.push(`${l.prenom || l.nageur} · ${ep(l)} : ${d.join(', ')}${nage ? ' (déjà nagée : gardée telle quelle)' : ''}`);
  });
  vieux.forEach(a => out.push(`${a.prenom || a.nageur} · ${ep(a)} : plus dans la liste de départ (forfait ?)`));
  // Courses préparées depuis le programme mais pas parties : gardées seulement si leur série est restée la même
  DB.ouvertes.filter(c => !parti(c) && !(c.undo || []).length && String(c.idCompet) === String(P.id_compet) && (c.deProg || anciensIds.has(c.idCourse))).forEach(c => {
    const g = G.find(x => x.id === c.idCourse);
    const pareil = g && g.suivis.length === c.nageurs.length && g.suivis.every(l => c.nageurs.some(s => memeNageur(s, l) && Number(s.couloir) === Number(l.couloir)));
    if (pareil) return;
    DB.ouvertes = DB.ouvertes.filter(x => x !== c); (DB.supprimees = DB.supprimees || []).push(c.uid);
    out.push(`${nomCourse(c)} · ${c.nageurs.map(prenom).join(', ')} : course préparée retirée (changée sur liveFFN), à préparer à neuf`);
  });
  return out;
}
// Toucher une course du programme : elle se prépare (nageurs suivis, couloirs, engagement) et s'ouvre, prête pour le DÉPART.
// Déjà préparée, partie ou nagée (même dans une autre série) : on la rouvre telle quelle (jamais recréée).
function ouvrirProgramme(id) {
  const g = coursesProgramme().find(x => x.id === id); if (!g) return;

function blocProgramme() {
  const P = DB.prog;
  const champ = `<div class="form"><div class="field" style="grid-column:1/-1"><label for="p-lien">Lien liveFFN de la compétition (ou son n°)</label>
      <input id="p-lien" type="url" value="${esc(P ? P.lien : '')}" placeholder="https://www.liveffn.com/cgi-bin/index.php?competition=…"></div></div>`;
  if (!P) return `<h2>Programme</h2>
    <p class="note">La veille ou sur place, avec du réseau : le Sheet lit la liste de départ du club sur liveFFN. Tes nageurs sont reconnus et suivis ; toucher une course la prépare avec ses couloirs.</p>
    ${champ}<div class="actions"><button class="btn go big" id="p-charger">Charger depuis liveFFN</button></div>`;
  const G = coursesProgramme(), avecSuivis = G.filter(g => g.suivis.length);
  // v26 : Prochaine = la 1re course pas encore partie APRÈS la dernière course partie ou nagée (ordre du programme).
  // Elle dépend de ce qui a été chronométré, pas de l'heure : une course non chronométrée (autre coach, oubli) ne bloque pas.
  const etats = avecSuivis.map(etatProg);
  const libre = k => !etats[k].fait && etats[k].t !== 'en cours';
  let dernier = -1; etats.forEach((e, k) => { if (!libre(k)) dernier = k; });
  const kP = [...avecSuivis.keys()].find(k => k > dernier && libre(k)) ?? [...avecSuivis.keys()].find(libre);
  const prochaine = kP == null ? null : avecSuivis[kP];
  const nonSuivis = P.lignes.filter(l => !l.suivi), ch = P.changements || [];
  // v30 (point 5) : la liste s'ouvre sur la course du moment. Ce qui est passé est replié en haut, sauf les 2 dernières
  // courses nagées ; une course en cours ou préparée n'est jamais repliée. L'ordre reste celui de la compétition.
  const faitsAvant = [...avecSuivis.keys()].filter(k => etats[k].fait && (kP == null || k < kP));
  let cut = faitsAvant.length > 2 ? faitsAvant[faitsAvant.length - 2] : 0;
  const kOuvert = [...avecSuivis.keys()].find(k => etats[k].t === 'en cours' || etats[k].t === 'prête');
  if (kOuvert != null) cut = Math.min(cut, kOuvert);
  let jour = '';

    const e = etats[k], titreJour = g.jour !== jour ? `<h3 class="jour">${esc(g.jour || '')}</h3>` : ''; jour = g.jour;

        <span>${g.suivis.map(l => `C${l.couloir} ${esc(l.prenom || l.nageur)}${l.engagement_s ? ' ' + fmt(l.engagement_s) : ''}`).join(' · ')} — ${e.t === 'en cours' ? '<span class="next">en cours</span>' : e.t}</span></button>`;
  };
  const passees = avecSuivis.slice(0, cut).map(ligneProg).join('');
  const nPassees = cut, nNagees = etats.slice(0, cut).filter(e => e.fait).length;
  jour = '';
  const suite = avecSuivis.slice(cut).map((g, j) => ligneProg(g, cut + j)).join('');
  return `<h2>Programme · ${esc(P.competition)}</h2>
    ${prochaine ? `<button class="btn go big" data-p="${esc(prochaine.id)}">▶ Prochaine : ${esc(prochaine.heure || '')} ${esc(nomEpreuve(prochaine))} · série ${esc(prochaine.serie)}<small style="display:block;font-family:var(--font-body);font-size:15px;letter-spacing:0;text-transform:none">${prochaine.suivis.map(l => `C${l.couloir} ${esc(l.prenom || l.nageur)}`).join(' · ')}</small></button>` : ''}
    <p class="note">${esc(P.lieu || '')} · ${esc(P.dates || '')} · bassin ${P.bassin} m · ${P.lignes.length} engagements du club, ${P.lignes.filter(l => l.suivi).length} suivis · chargé le ${fmtDate(P.chargeLe)}</p>
    ${ch.length ? `<details class="nons" id="p-ch"><summary>Changé sur liveFFN au dernier chargement (${ch.length}) : les courses nagées n'ont pas bougé</summary><ul class="note">${ch.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
    ${nPassees ? `<details class="nons" id="p-passees"><summary>✓ ${nPassees} course${nPassees > 1 ? 's' : ''} déjà passée${nPassees > 1 ? 's' : ''}${nNagees !== nPassees ? ` (${nNagees} nagée${nNagees > 1 ? 's' : ''})` : ''} : touche pour les voir</summary><div class="hist">${passees}</div></details>` : ''}
    <div class="hist" id="p-liste">${suite}</div>
    ${avecSuivis.length ? '' : '<p class="note warn">Aucun de tes nageurs reconnu : suis-les ci-dessous.</p>'}
    ${nonSuivis.length ? `<details class="nons"><summary>Autres nageurs du club, non suivis (${nonSuivis.length}) : touche pour suivre</summary>
      <div class="hist">${nonSuivis.map(l => `<button class="hist-item" data-suivre="${P.lignes.indexOf(l)}"><b>+ ${esc(l.nageur)}</b><span>${esc(l.heure || '')} ${esc(nomEpreuve(l))} · série ${esc(l.serie)} · C${l.couloir}</span></button>`).join('')}</div></details>` : ''}
    <details class="nons"><summary>Mettre à jour ou changer de compétition</summary>${champ}
      <div class="actions"><button class="btn" id="p-charger">Charger depuis liveFFN</button></div>
      <p class="note">Recharger ne touche jamais une course partie ou nagée, même si liveFFN a changé sa série. Une course seulement préparée (pas de DÉPART) est remise à jour si liveFFN l'a changée.</p></details>`;
}

function dossiersHistorique() {

  const actuel = DB.prog && par[DB.prog.competition] ? DB.prog.competition : DB.prog ? null : dossiers[0][0];
  const jourDe = ts => new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  const cleJour = ts => { const d = new Date(ts); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  const nomJour = ts => { const t = new Date(ts).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' }); return t.charAt(0).toUpperCase() + t.slice(1); };
  const item = ([c, k]) => {

function creerCourse() {
  const F = RT.form, n = F.distance / F.bassin;
  if (!Number.isInteger(n) || n < 1) { toast('Distance impossible dans ce bassin'); return; }
  const ps = pasPossibles(F.distance, F.bassin, F.nage);
  const pas = F.pas && ps.includes(F.pas) ? F.pas : ps.includes(pasDefaut(F.distance, F.bassin)) ? pasDefaut(F.distance, F.bassin) : F.bassin;
  if (F.nage === '4N' && n % 4) { toast('En 4N, il faut un nombre de longueurs multiple de 4 (100 en 25 m, 200 en 50 m…)', 4000); return; }
  const nageurs = [];
  for (const r of F.rows) {
    const n0 = r.id ? NAGEURS.find(x => String(x.id_nageur) === r.id) : null;
    const libre = r.libre.trim();
    if (!n0 && !libre) continue;
    const p = n0 ? { id_nageur: String(n0.id_nageur), nom: String(n0.nom), prenom: String(n0.prenom) }
      : (() => { const m = libre.split(/\s+/); return { id_nageur: '', prenom: m[0], nom: m.slice(1).join(' ') }; })();
    if (r.couloir === '') { toast(`Couloir de ${p.prenom || p.nom} ?`); return; }
    nageurs.push(Object.assign(p, { couloir: Number(r.couloir), murs: [], coulees: {}, cb: {}, statut: null, remarque: '', officiel: null, cumuls: null }));
  }
  if (!nageurs.length) { toast('Choisis au moins un nageur'); return; }
  const cl = nageurs.map(s => s.couloir);
  if (new Set(cl).size !== cl.length) { toast('Deux nageurs dans le même couloir'); return; }
  const c = { uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), createdAt: Date.now(), distance: F.distance, nage: F.nage, bassin: F.bassin, pas,
    serie: F.serie.trim(), competition: F.competition.trim(), nageurs, T0: null, undo: [], done: false };
  DB.prefs.competition = c.competition;
  DB.ouvertes.unshift(c); save();
  RT.form = Object.assign(formDefaut(), { distance: F.distance, nage: F.nage, bassin: F.bassin });
  C = c; view = 'course'; render();
}

// Place les coulées depuis le mur que le nageur vient de quitter, et la zone mur entre 15 m et le mur d'arrivée.
function placerLigne(card, c, s) {
  const eau = card.querySelector('.eau'); if (!eau) return;
  const L = lEnCours(c, s);
  const W = eau.clientWidth, H = eau.clientHeight, m = W / lgP(c, s, L);   // aux 50 m en 25 m : la ligne montre le 50 m déplié
  const bw = Math.max(40, Math.min(64, W * 0.07, (H / 2 - 6) * 1.6)), gap = 4;
  eau.style.setProperty('--bw', bw + 'px');
  const versPlots = (debP(c, s, L) / c.bassin) % 2 === 1;   // il a fait un nombre impair de longueurs : il revient vers les plots
  const depGauche = (plots() === 'g') !== versPlots;          // il part du bord gauche de l'écran ?
  // v28 (retour des Départementaux, capture de Sam du 21/11) : le bloc nageur (couloir, prénom, CB) se met du côté d'où il PART,
  // pour que la zone mur touche toujours le bord de l'écran, côté plots compris. Au mur, le bloc passe sous le doigt qui vient
  // de taper (CB de la longueur finie à portée). Nageur arrivé : le bloc reste du côté de son arrivée (CB de la dernière longueur).
  const fin = fini(c, s) || s.statut === 'abandon';
  const blocGauche = fin ? !depGauche : depGauche;
  card.style.flexDirection = blocGauche ? 'row' : 'row-reverse';
  let finCoulees = 0;
  [RANG_A, COULEES.filter(v => !RANG_A.includes(v))].forEach(rang => {
    let bord = 2;
    rang.forEach(v => {
      const centre = Math.max(DIST[v] * m, bord + bw / 2);
      const g = centre - bw / 2; bord = g + bw + gap; finCoulees = Math.max(finCoulees, bord);
      const b = card.querySelector(`.cou[data-v="${v}"]`);
      b.style.left = (depGauche ? g : W - g - bw) + 'px';
    });
  });
  const debutMur = Math.min(W - 60, Math.max(15 * m, finCoulees + 2));
  const t = card.querySelector('.tile');
  if (depGauche) { t.style.left = debutMur + 'px'; t.style.right = '0px'; } else { t.style.left = '0px'; t.style.right = debutMur + 'px'; }
  return depGauche;
}

      <p class="note">Abandon : la tuile s'arrête, les autres continuent. DSQ : noté, la tuile continue (le nageur finit sa course).</p>
      ${c.nageurs.map((s, i) => `<div class="trow"><b>C${s.couloir} ${esc(prenom(s))}</b>${fini(c, s) && s.statut !== 'abandon' ? `<span class="note">arrivé${s.statut === 'dsq' ? ' · DSQ' : ''}</span>` : ''}
        <div class="choix">${[[null, 'Nage'], ['abandon', 'Abandon'], ['dsq', 'DSQ']].map(([v, t]) => `<button data-i="${i}" data-v="${v || ''}" class="${(s.statut || null) === v ? 'on' : ''}">${t}</button>`).join('')}</div></div>`).join('')}
      <button class="btn danger big" id="t-fin">Fin de la course maintenant</button>
      <p class="note">Les temps non tapés seront « manque ».</p>
      <button class="btn" id="t-x">Fermer</button>
    </div></div>`;
    $('#layer').querySelectorAll('.choix button').forEach(b => b.onclick = () => { setStatut(+b.dataset.i, b.dataset.v || null); if (!c.done) dessine(); });
    armed($('#t-fin'), 'Confirmer : fin de la course', () => { fermerLayer(); finir(false); });
    $('#t-x').onclick = fermerLayer;
    $('#ov').onclick = e => { if (e.target.id === 'ov') fermerLayer(); };
  };
  dessine();
}
function fermerLayer() { $('#layer').innerHTML = ''; }

// ---------- Récap (corrigeable à volonté) ----------
function renderRecap() {
  const c = C, n = nbP(c, c.nageurs[0]);
  const sc = $('#app .scroll'), garde = sc && RT.recapUid === c.uid ? sc.scrollTop : 0;   // v25 : l'écran ne remonte plus en haut
  RT.recapUid = c.uid;
  $('#app').innerHTML = `
  <div class="view"><div class="scroll"><div class="panel">
    ${barreRetour()}
    <div class="actions"><button class="btn" id="r-home">← Compétition</button>
      ${peutRouvrir(c) ? `<button class="btn" id="r-rouvrir">↶ Annuler le dernier geste (rouvre la course)</button>` : ''}</div>
    <h1>${esc(nomCourse(c))}</h1>
    <p class="note">${c.endedAt ? 'Terminée le ' + fmtDate(c.endedAt) : ''} · ${!pasUnique(c) ? 'pas changé pendant la course : les distances sont dans chaque tableau' : pasDe(c) === c.bassin ? n + ' longueurs' : n + ' temps de passage (tous les ' + pasDe(c) + ' m)'}. Corrige un temps de passage (cumul) si un mur a été mal tapé : le split se recalcule. Les taps d'origine restent gardés.</p>
    <div class="form"><div class="field"><label for="r-serie">Série</label><input id="r-serie" type="text" value="${esc(c.serie || '')}"></div>
      <div class="field"><label for="r-compet">Compétition</label><input id="r-compet" type="text" value="${esc(c.competition || '')}"></div></div>
    <div class="actions" id="r-etat"></div>
    ${c.T0 != null ? '<div class="actions"><button class="btn" id="r-finale">+ Finale de cette épreuve</button></div>' : ''}
    ${c.nageurs.map((s, i) => blocNageur(c, s, i)).join('')}
  </div></div></div>`;
  majEtat(c);
  c.nageurs.forEach((s, i) => majBloc(c, i));
  if ($('#r-finale')) $('#r-finale').onclick = () => ouvrirFinale(c);
  lierRetour();
  $('#app').querySelectorAll('[data-x]').forEach(b => armed(b, 'Confirmer : retirer', () => {
    c.nageurs[+b.dataset.x].exclu = true; C = c; retouche(); renderRecap(); toast(`${prenom(c.nageurs[+b.dataset.x])} retiré des données de cette course`);
  }));
  const sc2 = $('#app .scroll'); if (sc2) sc2.scrollTop = garde;
  $('#r-home').onclick = () => { view = 'accueil'; render(); autoEnvoi(); };
  $('#r-compet').onchange = e => { c.competition = e.target.value.trim(); retouche(); };
  if ($('#r-rouvrir')) $('#r-rouvrir').onclick = () => { rouvrir(c); annuler(); };
  $('#r-serie').onchange = e => { c.serie = e.target.value.trim(); retouche(); };
  $('#app').querySelectorAll('[data-f]').forEach(el => {
    const ev = el.tagName === 'BUTTON' ? 'onclick' : 'onchange';
    el[ev] = () => editRecap(el.dataset.f, +el.dataset.i, el.dataset.k == null ? null : +el.dataset.k, el.value, el);
  });
}
// v25 : la zone « Valider / Envoyée » se met à jour seule, sans redessiner l'écran.
function majEtat(c) {
  const z = $('#r-etat'); if (!z) return;
  z.innerHTML = `${c.sentAt ? `<span class="note">Envoyée au Sheet le ${fmtDate(c.sentAt)}. Une correction la fera repasser « à valider ».</span>`
      : c.validee ? `<span class="note">Validée · elle part au Sheet dès qu'il y a du réseau.</span><button class="btn" id="r-envoi">Envoyer maintenant</button>`
      : `<button class="btn go big" id="r-valider">✓ Valider et envoyer</button><span class="note"><b>Pas encore validée</b> : corrige ce que tu veux, autant de fois que nécessaire. Rien ne part au Sheet avant « Valider ».</span>`}
      ${c.sentAt ? '' : '<button class="btn danger" id="r-suppr">Supprimer cette course</button>'}`;
  if ($('#r-valider')) $('#r-valider').onclick = async () => { const r = await validerCourses([c]); toast(msgValide(r), 4000); if (view === 'recap' && C === c) majEtat(c); };
  if ($('#r-envoi')) $('#r-envoi').onclick = async () => { try { await envoyerCourses([c]); toast('✓ Course envoyée au Sheet'); } catch (e) { toast(e.message, 4000); } if (view === 'recap' && C === c) majEtat(c); };
  // Course d'essai ou erreur : effacée de l'appareil (jamais envoyée). Du programme, elle redevient « à venir » et se prépare à neuf.
  if ($('#r-suppr')) armed($('#r-suppr'), 'Confirmer : supprimer (définitif)', () => {
    DB.hist = DB.hist.filter(x => x !== c); DB.ouvertes = DB.ouvertes.filter(x => x !== c);
    (DB.supprimees = DB.supprimees || []).push(c.uid);   // jamais « récupérée » depuis la copie du Sheet
    save(); C = null; view = 'accueil'; render(); toast('Course supprimée');
  });
}
// v25 : les calculs d'un nageur (splits, recalé, écart, alertes, statut) se mettent à jour sur place : l'écran ne bouge pas.
function majBloc(c, i) {
  const s = c.nageurs[i]; if (s.exclu || !$('#nag-' + i)) return;
  const n = nbP(c, s), cum = cumuls(c, s), e = ecart(c, s), rec = cumulsRecales(c, s), sp = splits(e != null ? rec : cum), final = cum[n - 1];
  const txt = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  txt('st-' + i, statut(c, s)); txt('fin-' + i, final != null ? fmt(final) : '—'); txt('ec-' + i, e != null ? fmtEcart(e) : '—');
  txt('thsp-' + i, 'Split' + (e != null ? ' (recalé)' : ''));
  const opt = $(`#nag-${i} select[data-f="statut"] option[value=""]`); if (opt) opt.textContent = `auto : ${statutAuto(c, s)}`;
  $('#al-' + i).innerHTML = (e != null && Math.abs(e) > 1 ? `<div class="alerte">⚠ Écart de plus d'1" : un mur oublié ou en trop ? Vérifie les splits avant de garder le recalage.</div>` : '')
    + (s.officiel != null && final == null ? `<div class="alerte">Pas de temps final mesuré : le recalage ne s'applique pas.</div>` : '');
  for (let k = 0; k < n; k++) {
    const td = document.getElementById(`sp-${i}-${k}`);
    if (td) { td.className = cum[k] == null ? 'manque' : ''; td.textContent = cum[k] == null ? 'manque' : sp[k] == null ? '—' : (sp[k] <= 0 ? '⚠ ' : '') + fmt(sp[k]); }
    txt(`rec-${i}-${k}`, e != null && rec[k] != null ? fmt(rec[k]) : '—');
    const inp = $(`#nag-${i} input[data-f="cumul"][data-k="${k}"]`);
    if (inp && document.activeElement !== inp) inp.value = cum[k] != null ? fmtEdit(cum[k]) : '';
  }
  const br = document.getElementById('br-' + i); if (br) br.hidden = !s.cumuls;
}
function blocNageur(c, s, i) {
  if (s.exclu) return `<section class="nag exclu" id="nag-${i}"><div class="nag-head"><span class="cl">C${s.couloir}</span>${esc(nomComplet(s))}
      <span class="note">retiré des données : pas envoyé au Sheet</span><button class="btn" data-f="remettre" data-i="${i}">Remettre</button></div></section>`;
  const n = nbP(c, s);
  const gros = 'font-size:22px;font-weight:700;min-height:48px;display:flex;align-items:center';
  return `<section class="nag" id="nag-${i}">
    <div class="nag-head"><span class="cl">C${s.couloir}</span>${esc(nomComplet(s))}
      <select data-f="statut" data-i="${i}" aria-label="Statut">${[['', `auto : ${statutAuto(c, s)}`], ['abandon', 'abandon'], ['dsq', 'dsq'], ['forfait', 'forfait']].map(([v, t]) => `<option value="${v}" ${(s.statut || '') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <span class="note">statut : <b id="st-${i}"></b></span>
      <button class="btn danger mini" data-x="${i}">Retirer des données</button></div>
    <div class="form">
      ${s.engagement ? `<div class="field"><label>Engagement</label><div class="num" style="${gros}">${fmt(s.engagement)}</div></div>` : ''}
      <div class="field"><label>Temps final mesuré</label><div class="num" id="fin-${i}" style="${gros}"></div></div>
      <div class="field"><label for="off-${i}">Temps officiel</label><input id="off-${i}" data-f="officiel" data-i="${i}" type="text" inputmode="decimal" placeholder="1:05.12" value="${s.officiel != null ? fmtEdit(s.officiel) : ''}"></div>
      <div class="field"><label>Écart (officiel − mesuré)</label><div class="num" id="ec-${i}" style="${gros}"></div></div>
    </div>
    <div id="al-${i}"></div>
    <div class="tablewrap"><table>
      <thead><tr><th>${enLongueurs(c, s) ? 'Long.' : 'Passage'}</th><th>Nage</th><th id="thsp-${i}">Split</th><th>Cumul mesuré</th><th>Cumul recalé</th><th>Coulée</th><th>CB</th><th></th></tr></thead>
      <tbody>${Array.from({ length: n }, (_, k) => `<tr>
        <td>${libP(c, s, k + 1)}</td><td>${nageP(c, s, k + 1)}</td>
        <td id="sp-${i}-${k}"></td>
        <td><input data-f="cumul" data-i="${i}" data-k="${k}" type="text" inputmode="decimal" value="" placeholder="manque" aria-label="Cumul L${k + 1}"></td>
        <td id="rec-${i}-${k}"></td>
        <td><select data-f="coulee" data-i="${i}" data-k="${k}" aria-label="Coulée L${k + 1}"><option value="">—</option>${COULEES.map(v => `<option value="${v}" ${s.coulees[k + 1] === v ? 'selected' : ''}>${coulTxt(v)}</option>`).join('')}</select></td>
        <td><input class="cbi" data-f="cb" data-i="${i}" data-k="${k}" type="text" inputmode="numeric" value="${esc(s.cb[k + 1] ?? '')}" aria-label="CB L${k + 1}"></td>
        <td><button class="btn mini" data-f="oublie" data-i="${i}" data-k="${k}" title="Un mur a été oublié avant celui-ci">+ oublié</button>
            <button class="btn mini" data-f="trop" data-i="${i}" data-k="${k}" title="Ce mur est en trop">✕ en trop</button></td>
      </tr>`).join('')}</tbody></table></div>
    <div class="actions" id="br-${i}" hidden><button class="btn" data-f="bruts" data-i="${i}">Revenir aux taps d'origine</button></div>
    <div class="field"><label for="rq-${i}">Remarque</label><textarea id="rq-${i}" data-f="remarque" data-i="${i}">${esc(s.remarque || '')}</textarea></div>
  </section>`;
}
// Toute correction d'une course validée ou envoyée la remet « à valider » (le renvoi remplacera ses lignes dans le Sheet).
function retouche() { C.retouche = true; delete C.validee; delete C.sentAt; save(); if (view === 'recap') majEtat(C); }
function editRecap(f, i, k, val, el) {
  const c = C, s = c.nageurs[i], n = nbP(c, s);
  const remet = () => { if (el && f === 'officiel') el.value = s.officiel != null ? fmtEdit(s.officiel) : ''; else if (el && f === 'cb') el.value = s.cb[k + 1] ?? ''; else majBloc(c, i); };
  if (f === 'remettre') { s.exclu = false; retouche(); renderRecap(); return; }
  if (f === 'statut') s.statut = val || null;
  else if (f === 'officiel') { const v = String(val).trim() ? parseTime(val) : null; if (String(val).trim() && v == null) { toast('Temps illisible : écris par ex. 1:05.12'); remet(); return; } s.officiel = v; }
  else if (f === 'remarque') s.remarque = val;
  else if (f === 'coulee') { if (val) s.coulees[k + 1] = val; else delete s.coulees[k + 1]; }
  else if (f === 'cb') { const v = String(val).trim(); if (v && !/^\d{1,3}$/.test(v)) { toast('CB : un nombre'); remet(); return; } if (v) s.cb[k + 1] = String(Number(v)); else delete s.cb[k + 1]; }
  else if (f === 'cumul') {
    const t = String(val).trim(), v = t ? parseTime(t) : null;
    if (t && v == null) { toast('Temps illisible : écris par ex. 1:02.30'); remet(); return; }
    const a = cumuls(c, s); a[k] = v; s.cumuls = a;
  } else if (f === 'oublie') {
    const a = cumuls(c, s);
    if (a[n - 1] != null) { toast('La dernière longueur a déjà un temps : supprime d\'abord un mur en trop', 3500); return; }
    a.splice(k, 0, null); a.length = n; s.cumuls = a;
  } else if (f === 'trop') { const a = cumuls(c, s); a.splice(k, 1); a.push(null); s.cumuls = a; }
  else if (f === 'bruts') s.cumuls = null;
  retouche();
  // Champs : mise à jour sur place (le doigt peut passer au champ suivant). Boutons qui changent le tableau : redessin, au même endroit.
  if (['oublie', 'trop', 'bruts'].includes(f)) renderRecap(); else majBloc(c, i);
}

// ---------- Finales (v25) : ajoutées à la main en 3 touches, liveFFN ne donnant leurs couloirs qu'après les séries ----------
function ouvrirFinale(c0) {
  const meme = c => c.distance === c0.distance && c.nage === c0.nage && (c.sexe || '') === (c0.sexe || '') && (c.pas || c.bassin) && c.bassin === c0.bassin
    && ((c0.idCompet && c.idCompet === c0.idCompet) || (!c0.idCompet && (c.competition || '') === (c0.competition || '')));
  const cand = [], vus = {};
  [c0, ...DB.hist, ...DB.ouvertes].filter(meme).forEach(c => c.nageurs.filter(s => !s.exclu).forEach(s => {
    const k = s.id_nageur || nomComplet(s); if (vus[k]) return; vus[k] = 1;
    cand.push({ s, coche: c === c0, couloir: s.couloir });
  }));
  let tour = 'Finale A';
  const dessine = () => {
    $('#layer').innerHTML = `<div class="overlay" id="ov"><div class="sheet">
      <h2>+ Finale · ${c0.distance} ${c0.nage}${c0.sexe ? ' ' + (SEXE[c0.sexe] || '') : ''}</h2>
      <div class="choix">${['Finale A', 'Finale B', 'Finale C', 'Barrage'].map(t => `<button data-t="${t}" class="${t === tour ? 'on' : ''}">${t}</button>`).join('')}</div>
      <p class="note">Coche les nageurs qualifiés et donne leur couloir de finale.</p>
      ${cand.map((x, j) => `<div class="fin-row"><button class="btn${x.coche ? ' go' : ''}" data-j="${j}">${x.coche ? '✓' : '+'}</button><b>${esc(nomComplet(x.s))}</b>
        <select data-c="${j}" aria-label="Couloir de ${esc(prenom(x.s))}">${Array.from({ length: 10 }, (_, k) => `<option value="${k}" ${x.couloir === k ? 'selected' : ''}>C${k}</option>`).join('')}</select></div>`).join('')}
      <button class="btn go big" id="fi-ok">Créer la finale</button>
      <button class="btn" id="fi-x">Fermer</button>
    </div></div>`;
    $('#layer').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tour = b.dataset.t; dessine(); });
    $('#layer').querySelectorAll('[data-j]').forEach(b => b.onclick = () => { cand[+b.dataset.j].coche = !cand[+b.dataset.j].coche; dessine(); });
    $('#layer').querySelectorAll('[data-c]').forEach(sel => sel.onchange = () => { cand[+sel.dataset.c].couloir = Number(sel.value); });
    $('#fi-x').onclick = fermerLayer;
    $('#fi-ok').onclick = () => {
      const pris = cand.filter(x => x.coche).sort((a, b) => a.couloir - b.couloir);
      if (!pris.length) { toast('Coche au moins un nageur'); return; }
      if (new Set(pris.map(x => x.couloir)).size !== pris.length) { toast('Deux nageurs dans le même couloir'); return; }
      const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const c = { uid, createdAt: Date.now(), distance: c0.distance, nage: c0.nage, bassin: c0.bassin, pas: pasDe(c0), serie: '', competition: c0.competition || '',
        idCompet: c0.idCompet, idCourse: `${c0.idCompet || 'M'}-${c0.distance}${c0.nage}${c0.sexe || ''}-${tour.replace(/\s+/g, '')}-${uid}`, numEpreuve: '', sexe: c0.sexe, tour,
        nageurs: pris.map(x => ({ id_nageur: x.s.id_nageur || '', nom: x.s.nom, prenom: x.s.prenom, couloir: x.couloir, engagement: x.s.engagement ?? null,
          murs: [], coulees: {}, cb: {}, statut: null, remarque: '', officiel: null, cumuls: null })),
        T0: null, undo: [], done: false };
      DB.ouvertes.unshift(c); C = c; save(); fermerLayer(); view = 'course'; render(); toast(`${tour} prête : DÉPART au signal`);
    };
    $('#ov').onclick = e => { if (e.target.id === 'ov') fermerLayer(); };
  };
  dessine();
}

// ---------- Démarrage ----------
function render() {
  fermerLayer();
  if ((view === 'course' || view === 'recap') && !C) view = 'accueil';
  if (view === 'course' && C.done && !saisieFin(C)) view = 'recap';
  if (view === 'accueil') renderAccueil();
  else if (view === 'course') renderCourse();
  else renderRecap();
}
// Reprise après fermeture de l'app ou rechargement : la course partie revient, le chrono continue (le départ est une heure, pas un compteur).
const enCoursAuLancement = DB.ouvertes.find(c => c.T0 != null);
if (enCoursAuLancement) { C = enCoursAuLancement; view = 'course'; keepAwake(); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
render();
majBandeau();
autoEnvoi();
// v26 : la copie de secours (IndexedDB) complète la mémoire principale course par course (avant : elle la remplaçait
// en entier si son compteur était plus grand, ce qui pouvait ramener un état plus ancien).
lireSecours().then(sec => {
  const n = sec && Array.isArray(sec.hist) ? fusionner(sec) : 0;
  if (!n) { copieSecours(); return; }
  save();
  if (!C) { C = DB.ouvertes.find(c => c.T0 != null) || null; if (C) view = 'course'; }
  render(); toast(`${n} course${n > 1 ? 's' : ''} complétée${n > 1 ? 's' : ''} depuis la copie de secours de l'iPad`, 5000);
});
// Une autre page de l'app (autre onglet) a écrit, ou l'app revient au premier plan : on reprend ce qu'elle a écrit,
// pour ne jamais réécrire par-dessus avec un état plus ancien.
function resynchroniser() {
  if (!relireMemoire()) return;
  if (view === 'course' && C && !C.done) renderCourse(); else render();
}
window.addEventListener('storage', e => { if (e.key === KEY_COURSES) resynchroniser(); });
window.addEventListener('pageshow', e => { if (e.persisted) resynchroniser(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resynchroniser(); });
setTimeout(sauverAuSheet, 3000);
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
