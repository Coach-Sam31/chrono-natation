<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chrono">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b5aa3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Chrono multi-nageurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Plage de bassin : un bandeau chrono en haut, une rangée par ligne d'eau, tuiles = nageurs dans l'ordre d'arrivée attendu */
:root {
  --bg: #e9f0f3;
  --surface: #ffffff;
  --ink: #06202c;
  --muted: #4f6873;
  --line: #b9cbd3;
  --lane: #0b5aa3;
  --lane-ink: #ffffff;
  --hot: #ffd400;
  --hot-ink: #1a1600;
  --wait: #d5e0e5;
  --done: #dfe7ea;
  --warn: #b93a07;
  --start: #d6141f;
  --start-ink: #ffffff;
  --wall: #0f2b3d;
  --wall-ink: #ffffff;
  --wall-muted: #b9d0dc;
  --cd: #ffd400;
  --cd-ink: #1a1600;
  --nage: #6a2fb5;
  --nage-ink: #ffffff;
  --cbq: #0a7d4f;
  --cbq-ink: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061118; --surface: #0f2430; --ink: #eaf4f8; --muted: #8fa9b4; --line: #26414e;
    --lane: #4aa3ff; --lane-ink: #04121a; --hot: #ffd400; --hot-ink: #1a1600;
    --wait: #13303d; --done: #0a1a22; --warn: #ff8a4c; --nage: #b693ff; --nage-ink: #1a0b33; --cbq: #3ddc97; --cbq-ink: #04121a; --wall: #dfeaf0; --wall-ink: #06202c; --wall-muted: #3d5866; --cd: #ffd400; --cd-ink: #1a1600; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061118; --surface: #0f2430; --ink: #eaf4f8; --muted: #8fa9b4; --line: #26414e;
  --lane: #4aa3ff; --lane-ink: #04121a; --hot: #ffd400; --hot-ink: #1a1600;
  --wait: #13303d; --done: #0a1a22; --warn: #ff8a4c; --nage: #b693ff; --nage-ink: #1a0b33; --cbq: #3ddc97; --cbq-ink: #04121a; --wall: #dfeaf0; --wall-ink: #06202c; --wall-muted: #3d5866; --cd: #ffd400; --cd-ink: #1a1600; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; overflow: hidden;
}
#app { height: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.view { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 10px 28px; box-sizing: border-box; }

/* Bandeau */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(38px, 7vw, 64px); line-height: 1; letter-spacing: .01em; }
.rep { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 3.4vw, 30px); color: var(--muted); }
.rep b { color: var(--ink); }
.bar .spacer { flex: 1; }
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 12px 18px; font-weight: 600; min-height: 52px; }
.btn.big { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 10px 26px; }
.btn.go { background: var(--lane); color: var(--lane-ink); border-color: var(--lane); }
.btn.undo { font-size: 18px; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .35; }

/* Grille */
.lanes { flex: 1; min-height: 0; display: grid; gap: 8px; }
.lane { display: grid; grid-template-columns: 34px 1fr; gap: 6px; min-height: 0; }
.lane-tag { background: var(--lane); color: var(--lane-ink); border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.tiles { display: grid; gap: 6px; min-height: 0; }
.lane.bout { grid-template-columns: none; grid-template-rows: 30px minmax(0, 1fr); min-width: 0; }
.lane.bout .lane-tag { font-size: 18px; }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hist-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; min-height: 52px; }
.hist-item span { color: var(--muted); font-size: 14px; }
details.essai { border: 2px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
details.essai summary { font-family: var(--font-display); font-weight: 700; font-size: 22px; cursor: pointer; min-height: 40px; line-height: 40px; }
details.essai > * + * { margin-top: 12px; }
.tag-essai { background: var(--warn); color: #fff; font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 4px 8px; }
.tile {
  position: relative; border: 3px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0;
  overflow: hidden; touch-action: none; gap: 2px;
  container-type: size; /* le texte se règle sur la taille de la tuile, quelle que soit la vue */
}
.tile .name { font-family: var(--font-display); font-weight: 700; font-size: clamp(12px, min(22cqh, 15cqw), 30px); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.tile .time { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, min(32cqh, 17cqw), 44px); line-height: 1.1; white-space: nowrap; }
.tile .meta { font-size: clamp(9px, min(13cqh, 9cqw), 14px); line-height: 1.25; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lanes.dense .tile { padding: 4px 6px; border-width: 2px; border-radius: 10px; }
.lanes.dense .tile .badge { font-size: 9px; padding: 1px 4px; top: 3px; right: calc(var(--sq) + 8px); }
.tile.wait { background: var(--wait); border-style: dashed; }
.tile.wait .time { font-size: clamp(12px, min(22cqh, 13cqw), 24px); color: var(--muted); }
/* Au repos : le temps nagé reste lisible de loin */
/* Au mur : tuile foncée, temps nagé en gros, très lisible et impossible à confondre avec un nageur dans l'eau */
.tile.wait.rest { background: var(--wall); border: 3px solid var(--wall); color: var(--wall-ink); }
.tile.wait.rest .time { font-size: clamp(14px, min(32cqh, 17cqw), 44px); color: var(--wall-ink); }
.tile.wait.rest .meta { color: var(--wall-muted); }
/* Dans l'eau : tuile blanche, bord épais couleur de ligne */
.tile.swim { background: var(--surface); border: 3px solid var(--lane); }
.tile.swim .meta { color: var(--lane); font-weight: 600; }
/* Décompte avant départ : toujours la même pastille, au même endroit */
.tile .cd { align-self: flex-start; background: var(--cd); color: var(--cd-ink); font-family: var(--font-display); font-weight: 700;
  font-size: clamp(14px, min(24cqh, 14cqw), 34px); line-height: 1.1; border-radius: 8px; padding: 2px 10px; white-space: nowrap; }
.tile.wait.go .time { font-size: clamp(22px, min(48cqh, 26cqw), 72px); color: var(--start-ink); }
/* Tap refusé (trop tôt) : éclair orange */
.tile.refus { background: var(--warn) !important; border-color: var(--warn) !important; color: #fff !important; }
.tile.hot { background: var(--hot); border-color: var(--hot-ink); color: var(--hot-ink); }
/* 3 dernières secondes avant le départ du nageur : rouge plein, pour le lancer */
.tile.wait.go { background: var(--start); border: 3px solid var(--start); color: var(--start-ink); }
.tile.wait.go .time, .tile.wait.go .meta { color: var(--start-ink); }
.tile.hot .meta { color: var(--hot-ink); }
.tile.done { background: var(--done); border-color: var(--done); opacity: .7; }
.tile.cb { border-color: var(--lane); border-style: solid; }
.tile.cb .meta { color: var(--lane); font-weight: 600; }
/* Deux petits carrés au bord droit de la tuile : la nage (violet) et les coups de bras (vert).
   Ils ne répondent que si le nageur ne nage pas ; pendant qu'il nage, toute la tuile, carrés compris, reste le bouton chrono. */
.tile { --sq: clamp(24px, min(38cqh, 22cqw), 46px); }
.tile .name, .tile .time, .tile .meta { padding-right: calc(var(--sq) + 6px); }
.tile .sqs { position: absolute; top: 5px; right: 5px; bottom: 5px; width: var(--sq); display: flex; flex-direction: column; justify-content: space-between; }
.lanes.dense .tile .sqs { top: 3px; right: 3px; bottom: 3px; }
.sq { width: var(--sq); height: var(--sq); max-height: calc(50% - 2px); border-radius: 8px; box-sizing: border-box; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; line-height: 1; white-space: nowrap; overflow: hidden; }
.sq.nage { background: var(--nage); color: var(--nage-ink); font-size: calc(var(--sq) * .56); }
.sq.cbq { background: var(--surface); color: var(--cbq); border: 2px solid var(--cbq); font-size: calc(var(--sq) * .36); }
.sq.cbq.due { background: var(--cbq); color: var(--cbq-ink); }
.sq.cbq.off { opacity: .4; }
.tile.swim .sq { opacity: .45; }
.tile.wait.pause { border-style: dotted; }
.nage-keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.nage-keys .pad-key { min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.nage-keys .pad-key small { font-family: var(--font-body); font-size: 12px; font-weight: 600; }
.nage-keys .pad-key.on { background: var(--nage); color: var(--nage-ink); border-color: var(--nage); }
/* Tuile étroite (iPhone tenu debout, lignes chargées) : les deux carrés passent en bas, côte à côte, à la place de la petite ligne de texte. */
@container (max-width: 104px) {
  .tile .name, .tile .time, .tile .meta { padding-right: 0; }
  .tile .meta { visibility: hidden; height: calc(var(--sq) + 2px); flex-shrink: 0; }
  .tile .sqs, .lanes.dense .tile .sqs { top: auto; left: 4px; right: 4px; bottom: 4px; width: auto; flex-direction: row; }
  .sq { max-height: none; }
  .tile .badge, .lanes.dense .tile .badge { right: 3px; }
}
.pad { border: 3px solid var(--lane); background: var(--surface); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.pad-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pad-head b { font-family: var(--font-display); font-size: 24px; }
.pad-head span { color: var(--muted); flex: 1; }
.pad-head .btn { min-height: 40px; padding: 6px 14px; }
.pad-lens { display: flex; gap: 6px; flex-wrap: wrap; }
.pad-len { border: 2px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 56px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; }
.pad-len small { color: var(--muted); font-size: 11px; }
.pad-len b { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.pad-len.on { border-color: var(--lane); background: var(--surface); }
.pad-keys { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.pad-key { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; min-height: 52px; font-family: var(--font-display); font-weight: 700; font-size: 26px; }
.pad-key.go { background: var(--lane); color: var(--lane-ink); border-color: var(--lane); }
@media (max-width: 700px) { .pad-keys { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.cbline { font-size: 12px; color: var(--muted); }
.rpe-keys { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.rpe-keys .pad-key { min-height: 64px; font-size: 30px; }
td.rpe-cell { text-align: center; font-size: 18px; }
.todo { color: var(--warn); font-size: 13px; font-weight: 600; }
td.cb-missing .cbline { color: var(--warn); }
.tile.flash { animation: flash .35s; }
.tile.tapped { border-color: var(--lane); background: var(--lane); color: var(--lane-ink); transition: none; }
.tile.tapped .meta, .tile.tapped .time { color: var(--lane-ink); }
.bar.trot { gap: 8px; }
.bar.trot .btn { min-height: 44px; padding: 8px 14px; }
#trot-info { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink); }
.tile .badge { position: absolute; top: 6px; right: calc(var(--sq) + 11px); background: var(--warn); color: #fff; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 6px; }
.tile::after { content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--lane); }
.tile.pressing::after { width: 100%; transition: width .9s linear; }
@keyframes flash { 0%, 100% { transform: none; } 30% { transform: translateX(-5px); } 70% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { .tile.flash { animation: none; } .tile.pressing::after { transition: none; } }

/* Préparation & récap */
.scroll { overflow-y: auto; flex: 1; min-height: 0; }
.panel { max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 36px; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; }
.note { color: var(--muted); margin: 0; max-width: 65ch; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
/* Pas de zoom involontaire : double-tap neutralisé partout, et champs à 16px (l'iPad zoome sur un champ plus petit) */
* { touch-action: manipulation; }
input, select, textarea { font-size: 16px !important; }
.field input, .field select { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; min-height: 48px; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.preview { display: flex; flex-direction: column; gap: 6px; }
.preview div { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.cell { cursor: pointer; }
td.manque { color: var(--warn); font-weight: 600; }
td.nf { color: var(--muted); font-style: italic; }

/* Menus */
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 18px; width: min(460px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow-y: auto; box-sizing: border-box; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .row > * { flex: 1; }
.order { display: flex; gap: 6px; flex-wrap: wrap; }
.order .chip.me { border-color: var(--lane); background: var(--lane); color: var(--lane-ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; }
</style>

</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
const APP_VERSION = 'v10';
const KEY = 'chrono-maquette-v1';
const KEY_HIST = 'chrono-maquette-historique-v1';
const NAMES = ['Léa M.', 'Tom B.', 'Inès R.', 'Hugo D.', 'Jade P.', 'Noah L.', 'Manon G.', 'Enzo F.',
  'Chloé T.', 'Lucas V.', 'Zoé C.', 'Malo S.', 'Lina A.', 'Adam K.', 'Rose N.', 'Théo J.',
  'Emma H.', 'Louis E.', 'Alice W.', 'Jules O.', 'Lou Q.', 'Nino Y.', 'Anna U.', 'Gabin I.',
  'Mia Z.', 'Sacha X.', 'Eva B.', 'Liam C.', 'Nina D.', 'Paul F.', 'Sara G.', 'Yanis H.'];
const LONG_PRESS_MS = 900, DISPLAY_DELAY_MS = 1000, HOT_BEFORE_MS = 4000;

let S = null;          // état de la série (sauvegardé à chaque action)
let view = 'setup';    // setup | chrono | recap
let display = [];      // ordre affiché des tuiles par ligne (suit S.queue avec ~1" de retard)
let laneTimers = [];
let undoStack = [];
let presses = new Map();
let tileEls = {};
let wakeLock = null;
let finishTimer = null;
let HIST = [];

// ---------- Utilitaires ----------
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// Temps enregistrés au centième (1'12"43) ; le temps qui défile sur la tuile reste au dixième (dec = 1).
function fmt(sec, dec = 2) {
  if (sec == null) return '';
  const u = 10 ** dec, t = Math.round(sec * u), m = Math.floor(t / (60 * u)), rest = t - m * 60 * u;
  const ss = Math.floor(rest / u), frac = String(rest % u).padStart(dec, '0');
  return m ? `${m}'${String(ss).padStart(2, '0')}"${frac}` : `${ss}"${frac}`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function parseTime(str) {
  str = String(str).trim().replace(',', '.').replace(/"/g, '.').replace(/'/g, ':');
  if (!str) return null;
  const p = str.split(':');
  const v = p.length === 2 ? Number(p[0]) * 60 + Number(p[1]) : Number(p[0]);
  return Number.isFinite(v) && v > 0 ? v : null;
}
// Série en cours sous KEY ; séries terminées dans l'historique (HIST), toujours modifiables.
function save() {
  if (!S) return;
  try {
    if (S.done) {
      const i = HIST.findIndex(x => x.uid === S.uid);
      if (i >= 0) HIST[i] = S; else HIST.unshift(S);
      localStorage.setItem(KEY_HIST, JSON.stringify(HIST));
    } else localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {}
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && !s.done ? s : null; } catch (e) { return null; } }
function loadHist() { try { return JSON.parse(localStorage.getItem(KEY_HIST)) || []; } catch (e) { return []; } }
function fmtDate(ts) { return new Date(ts).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
// Bouton à deux temps (le navigateur n'affiche pas de fenêtre de confirmation)
function armed(btn, confirmLabel, action) {
  const label = btn.textContent;
  btn.onclick = () => {
    if (btn.dataset.armed) { action(); return; }
    btn.dataset.armed = '1'; btn.textContent = confirmLabel;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; } }, 4000);
  };
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

// ---------- Calcul des temps (§4 du cahier des charges) ----------
const nb = () => S.cfg.nbRep;
const cycleMs = () => S.cfg.cycle * 1000;
function laneOf(id) { return S.lanes.findIndex(l => l.includes(id)); }
// Pauses : un départ prévu après le début d'une pause est repoussé de la durée de cette pause.
// Tant que la pause dure, il recule avec l'horloge : son décompte reste figé. Les nageurs déjà partis ne sont pas touchés.
function decale(t) {
  for (const p of S.pauses || []) if (t >= p.at) t += p.dur;
  if (S.pause && t >= S.pause.at) t += Date.now() - S.pause.at;
  return t;
}
function dep(id, r) { return decale(S.T0 + r * cycleMs() + (S.order[id][r] - 1) * S.cfg.vague * 1000); }
// Nombre de répétitions dont la tête de ligne est déjà partie (pauses comprises)
function repsLancees() {
  if (S.T0 == null) return 0;
  const now = Date.now(); let n = 0;
  for (let r = 0; r < nb(); r++) if (decale(S.T0 + r * cycleMs()) <= now) n++;
  return n;
}
function pending(id) { return S.res[id].findIndex(x => !x); }
function expected(id, p) {
  const prev = S.res[id].slice(0, p).reverse().find(x => x && x.st === 'ok');
  const cible = (S.cfg.cibles && S.cfg.cibles[id]) || S.cfg.cible;
  const est = prev ? prev.t : (cible || S.cfg.cycle * 0.75);
  return dep(id, p) + est * 1000;
}
function laneLabel(l) { return (S.cfg.laneNums && S.cfg.laneNums[l]) || l + 1; }

// Série d'essai : nageurs fictifs, jamais envoyée au Sheet
function newSeries(cfg) {
  const lanes = [], names = {};
  let k = 0;
  for (let l = 0; l < cfg.lanes; l++) {
    const ids = [];
    for (let i = 0; i < cfg.perLane; i++) { const id = 's' + k; names[id] = NAMES[k++]; ids.push(id); }
    lanes.push(ids);
  }
  buildSeries(Object.assign({ essai: true, nage: 'NL' }, cfg), lanes, names, {});
}
function buildSeries(cfg, lanes, names, info) {
  const order = {}, res = {};
  lanes.forEach(ids => ids.forEach((id, i) => { order[id] = Array(cfg.nbRep).fill(i + 1); res[id] = Array(cfg.nbRep).fill(null); }));
  departPrevu = null;
  S = { uid: Date.now(), cfg, names, info, lanes, laneOrder: lanes.map(l => [...l]), queue: lanes.map(l => [...l]), order, res, T0: null };
  syncDisplay(); undoStack = []; save();
}

// ---------- Lien avec le Google Sheet (Apps Script) ----------
// L'adresse est publique ; sans le code secret (gardé sur l'appareil), le script refuse tout.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYb6vBHxEX3fqJYsXS-O1LqGJdQ5pi4gbaZvVz83nR57c6B7zoIBus3Uf--8si9rnlEw/exec';
const KEY_SECRET = 'chrono-secret', KEY_PLAN = 'chrono-plan';
function getLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function setLS(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let PLAN = (() => { try { return JSON.parse(getLS(KEY_PLAN)); } catch (e) { return null; } })(); // { nageurs, series, loadedAt }

async function callSheet(body) {
  const secret = getLS(KEY_SECRET);
  if (!secret) throw new Error('Code secret non enregistré sur cet appareil');
  let rep;
  try { rep = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, body, { secret })) }); }
  catch (e) { throw new Error('Pas de réseau : réessaie quand le wifi revient'); }
  let data; try { data = await rep.json(); } catch (e) { throw new Error('Réponse du Sheet illisible'); }
  if (!data.ok) throw new Error(data.erreur || 'Réponse du Sheet inattendue');
  return data;
}
async function chargerSheet() {
  const d = await callSheet({ action: 'charger' });
  PLAN = { nageurs: d.nageurs, series: d.series, loadedAt: Date.now() };
  setLS(KEY_PLAN, JSON.stringify(PLAN));
}
function seriesPretes() {
  if (!PLAN) return [];
  const par = {};
  PLAN.series.forEach(r => { const k = String(r.id_serie); (par[k] = par[k] || []).push(r); });
  return Object.entries(par).map(([id, rows]) => ({ id, rows, f: rows[0] }));
}
function nagesSerie(rows) { const n = [...new Set(rows.map(r => String(r.nage || '')).filter(Boolean))]; return n.length > 1 ? 'spé (' + n.join('/') + ')' : (n[0] || ''); }
function fmtJour(v) { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function startPlanned(id, viewChoice) {
  const sp = seriesPretes().find(x => x.id === id); if (!sp) return;
  const f = sp.f, nag = Object.fromEntries((PLAN.nageurs || []).map(n => [String(n.id_nageur), n]));
  const laneNums = [...new Set(sp.rows.map(r => +r.ligne))].sort((a, b) => a - b);
  // Cible de chaque nageur : celle tapée à la main, sinon celle calculée depuis ses allures (colonne cible_auto_s)
  const cibleDe = r => +r.temps_cible_s || +r.cible_auto_s || null;
  const cibles = Object.fromEntries(sp.rows.map(r => [String(r.id_nageur), cibleDe(r)]));
  // Série « spé » : chaque nageur nage sa spécialité, la nage est donc propre à chacun
  const nages = Object.fromEntries(sp.rows.map(r => [String(r.id_nageur), String(r.nage || '')]));
  // Ordre de départ : celui du Sheet ; sinon du plus rapide au plus lent selon les cibles
  const rang = r => (+r.ordre ? +r.ordre : 1000 + (cibleDe(r) || 999));
  const lanes = laneNums.map(L => sp.rows.filter(r => +r.ligne === L).sort((a, b) => rang(a) - rang(b)).map(r => String(r.id_nageur)));
  const names = {}, info = {};
  lanes.flat().forEach(i => {
    const n = nag[i] || { nom: i, prenom: '' };
    info[i] = { nom: String(n.nom), prenom: String(n.prenom) };
    names[i] = n.prenom ? `${n.prenom} ${String(n.nom).charAt(0)}.` : String(n.nom);
  });
  const nbRep = +f.nb_rep;
  const countReps = [...new Set(String(f.reps_comptage || '').split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= nbRep))].sort((a, b) => a - b);
  buildSeries({
    distance: +f.distance, nbRep, cycle: +f.cycle_s, vague: +f.vague_s, bassin: +f.bassin_m || 25, countReps,
    lanes: lanes.length, perLane: Math.max(...lanes.map(l => l.length)), view: viewChoice,
    nage: String(f.nage || ''), groupe: String(f.groupe || ''), idSerie: sp.id, cibles, nages, laneNums
  }, lanes, names, info);
}

// Une ligne par répétition et par nageur (format de l'onglet Resultats)
function appareil() { const ua = navigator.userAgent; return /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : 'autre'; }
function lignesSheet(s) {
  const prev = S; S = s;
  const d = new Date(s.T0), date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const c = s.cfg, rows = [];
  s.lanes.forEach((ids, l) => ids.forEach(id => s.res[id].forEach((x, r) => {
    const cb = cbOf(id, r);
    rows.push({
      date, groupe: c.groupe, id_serie: c.idSerie, distance: c.distance, nage: nageDe(id, r), bassin_m: c.bassin, nb_rep: c.nbRep,
      cycle_s: c.cycle, vague_s: c.vague, ligne: laneLabel(l), ordre: s.order[id][r], id_nageur: id,
      nom: s.info[id].nom, prenom: s.info[id].prenom, rep: r + 1,
      temps_s: x && x.st === 'ok' ? Math.round(x.t * 100) / 100 : '', coups_bras: cb ? cb.map(v => v ?? '').join(';') : '',
      rpe: rpeOf(id) ?? '', statut: x ? x.st : 'manque', appareil: appareil()
    });
  })));
  S = prev; return rows;
}
function aEnvoyer() { return HIST.filter(h => !h.cfg.essai && !h.sentAt); }
function saveHist() { try { localStorage.setItem(KEY_HIST, JSON.stringify(HIST)); } catch (e) {} }
async function envoyer(liste) {
  let n = 0;
  for (const s of liste) {
    await callSheet({ action: 'envoyer', lignes: lignesSheet(s) });
    s.sentAt = Date.now(); n++; saveHist();
  }
  return n;
}
// Envoi automatique dès qu'il y a du réseau : fin de série, ouverture de l'app, retour du wifi, retour à l'accueil.
let envoiEnCours = false;
async function autoEnvoi() {
  if (envoiEnCours || !getLS(KEY_SECRET) || navigator.onLine === false || !aEnvoyer().length) return;
  envoiEnCours = true;
  try {
    const n = await envoyer(aEnvoyer());
    if (n) { toast(`✓ ${n} série${n > 1 ? 's' : ''} envoyée${n > 1 ? 's' : ''} au Sheet`); if (view !== 'chrono') render(); }
  } catch (e) { /* pas de réseau ou Sheet injoignable : on réessaiera au prochain déclencheur */ }
  envoiEnCours = false;
}
window.addEventListener('online', autoEnvoi);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoEnvoi(); });

// Une correction après envoi : la série repasse « à envoyer » (le renvoi remplace ses lignes dans le Sheet)
function touched() { if (S && S.done && S.sentAt) S.sentAt = null; }

// ---------- Coups de bras : un chiffre par longueur, sur les répétitions comptées ----------
// Hors de la pile Annuler : « Annuler » ne défait que les taps chrono.
function nLen() { return Math.max(1, Math.round(S.cfg.distance / (S.cfg.bassin || 25))); }
function isCounted(r) { return (S.cfg.countReps || []).includes(r + 1); }
function cbOf(id, r) { return (S.cb && S.cb[id] && S.cb[id][r]) || null; }
function setCb(id, r, arr) {
  S.cb = S.cb || {}; S.cb[id] = S.cb[id] || Array(nb()).fill(null);
  S.cb[id][r] = arr.some(v => v != null) ? arr : null; touched(); save();
}
function cbComplete(id, r) { const a = cbOf(id, r); return !!a && a.length === nLen() && a.every(v => v != null); }
function cbText(a) { return a ? a.map(v => v == null ? '?' : v).join('·') : ''; }
// Répétition dont les coups de bras restent à noter (la dernière terminée, si elle est comptée)
function cbTarget(id) {
  const r = S.res[id].reduce((acc, x, i) => (x ? i : acc), -1);
  return r >= 0 && S.res[id][r].st === 'ok' && isCounted(r) && !cbComplete(id, r) ? r : null;
}

// ---------- Nage de chaque nageur : affichée sur sa tuile, modifiable au bord du bassin ----------
const NAGES = [['NL', 'C', 'Crawl'], ['Dos', 'D', 'Dos'], ['Brasse', 'B', 'Brasse'], ['Pap', 'P', 'Papillon'], ['4N', '4N', '4 nages']];
function nageDe(id, r) { return (S.nagesRep && S.nagesRep[id] && S.nagesRep[id][r]) || (S.cfg.nages && S.cfg.nages[id]) || S.cfg.nage || ''; }
function lettreNage(n) {
  const v = String(n || '').trim().toLowerCase();
  if (!v) return '–';
  if (v === '4n') return '4N';
  if (v === 'nl' || v[0] === 'c') return 'C';
  if (v[0] === 'd') return 'D';
  if (v[0] === 'b') return 'B';
  if (v[0] === 'p') return 'P';
  return v.slice(0, 2).toUpperCase();
}
function repCourante(id) { const p = pending(id); return p < 0 ? nb() - 1 : p; }
// Avant le départ (ou série finie pour lui) : pour toute la série. En cours de série : à partir de la répétition à venir,
// les répétitions déjà nagées gardent leur nage. Hors de la pile Annuler, comme les coups de bras.
function setNage(id, n) {
  const p = pending(id), from = S.T0 == null || p < 0 ? 0 : p;
  const a = Array.from({ length: nb() }, (_, r) => (r >= from ? n : nageDe(id, r)));
  S.nagesRep = S.nagesRep || {}; S.nagesRep[id] = a;
  if (from === 0) S.cfg.nages = Object.assign(S.cfg.nages || {}, { [id]: n });
  touched(); save();
}
function openNage(id) {
  const cur = lettreNage(nageDe(id, repCourante(id))), p = pending(id), ouvert = Date.now();
  const portee = S.T0 == null || p < 0 ? 'Pour toute la série.' : `À partir de la rép. ${p + 1} ; les répétitions déjà nagées gardent leur nage.`;
  $('#layer').innerHTML = `
  <div class="overlay" id="ov"><div class="sheet" role="dialog" aria-label="Nage de ${esc(S.names[id])}">
    <h2>Nage · ${esc(S.names[id])}</h2>
    <div class="nage-keys">${NAGES.map(([v, l, nom]) => `<button class="pad-key ${cur === l ? 'on' : ''}" data-nage="${v}">${l}<small>${nom}</small></button>`).join('')}</div>
    <p class="note">${portee}</p>
    <button class="btn big" id="n-close">Fermer</button>
  </div></div>`;
  $('#ov').addEventListener('pointerdown', e => { if (e.target.id === 'ov') closeLayer(); });
  $('#n-close').onclick = closeLayer;
  $('#layer').querySelectorAll('[data-nage]').forEach(b => b.onclick = () => {
    if (Date.now() - ouvert < 350) return; // le doigt qui vient d'ouvrir ce choix ne doit pas choisir à sa place
    const n = NAGES.find(x => x[0] === b.dataset.nage);
    setNage(id, n[0]); closeLayer(); tick(); toast(`${S.names[id]} · ${n[2]}`);
  });
}
// Tap sur un petit carré. Pendant que le nageur nage, les carrés sont inactifs : le tap reste un tap chrono.
function nageEnCours(id, t) { if (S.T0 == null) return false; const p = pending(id); return p >= 0 && t >= dep(id, p); }
function tapCarre(id, quoi) {
  if (quoi === 'nage') { openNage(id); return; }
  const r = cbTarget(id) ?? S.res[id].reduce((acc, x, i) => (x && x.st === 'ok' ? i : acc), -1);
  if (r >= 0) openPad(id, r); else { flash(id); toast('Coups de bras : après sa première répétition'); }
}

function snapshot() { return JSON.stringify({ res: S.res, order: S.order, queue: S.queue, laneOrder: S.laneOrder, lanes: S.lanes, T0: S.T0, absents: S.absents || [], pauses: S.pauses || [], pause: S.pause || null }); }
// Chaque action annulable porte un libellé : « Annuler » dit ce qu'il défait (« Léa, arrivée rép. 4 »).
function pushUndo(label = 'dernière action') { undoStack.push(JSON.stringify({ s: snapshot(), label })); if (undoStack.length > 300) undoStack.shift(); }
function undo() {
  const e = undoStack.pop(); if (!e) { toast('Rien à annuler'); return; }
  const { s, label } = JSON.parse(e);
  Object.assign(S, JSON.parse(s)); syncDisplay(); save(); render(); toast(`Annulé : ${label}`);
}
function syncDisplay() { display = S.queue.map(q => [...q]); laneTimers.forEach(clearTimeout); }
function scheduleDisplay(l, delay = DISPLAY_DELAY_MS) {
  clearTimeout(laneTimers[l]);
  laneTimers[l] = setTimeout(() => {
    // Jamais de redessin pendant qu'un doigt est posé : le relâcher serait perdu.
    if (presses.size) { scheduleDisplay(l, 250); return; }
    display[l] = [...S.queue[l]]; buildGrid();
  }, delay);
}
function moveToEnd(id) { const q = S.queue[laneOf(id)]; q.splice(q.indexOf(id), 1); q.push(id); }

function tap(id, t) {
  if (S.T0 == null) return;
  let p = pending(id);
  if (p < 0) { const r = cbTarget(id); if (r != null) openPad(id, r); return; } // série finie : il peut rester ses coups de bras
  // Nageur au repos : le tap ouvre le pavé des coups de bras s'il en reste à noter.
  if (t < dep(id, p)) { const r = cbTarget(id); if (r != null) openPad(id, r); else flash(id); return; }
  // Tap oublié : si on est déjà après le départ de la répétition suivante, ce tap lui appartient.
  let q = p; while (q + 1 < nb() && t >= dep(id, q + 1)) q++;
  // Tap impossible (goutte d'eau, doigt qui frôle) : arrivée bien trop rapide pour ce nageur → ignoré.
  const duree = (t - dep(id, q)) / 1000;
  if (duree < tempsMini(id, q)) {
    flashRefus(id); toast(`Tap ignoré : ${S.names[id]} en ${fmt(duree, 1)}, trop tôt · appui long pour corriger`);
    return;
  }
  pushUndo(`${S.names[id]}, arrivée rép. ${q + 1}`);
  while (p < q) { S.res[id][p] = { t: null, st: 'manque', auto: true }; p++; }
  S.res[id][p] = { t: duree, st: 'ok' };
  moveToEnd(id); save(); scheduleDisplay(laneOf(id)); checkFinish();
  const el = tileEls[id]; if (el) { el.classList.add('tapped'); setTimeout(() => el.classList.remove('tapped'), 600); }
  bip(1000, 0.07);
}
function flash(id) { const el = tileEls[id]; if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function flashRefus(id) { flash(id); const el = tileEls[id]; if (el) { el.classList.add('refus'); setTimeout(() => el.classList.remove('refus'), 700); } bip(300, 0.15); }
// Temps le plus court accepté pour une arrivée : 60 % de son temps habituel (rép. précédente ou cible),
// et jamais moins de 0,45 s par mètre (≈ 22" au 50), même sans repère.
function tempsMini(id, r) {
  const prev = S.res[id].slice(0, r).reverse().find(x => x && x.st === 'ok');
  const repere = prev ? prev.t : (S.cfg.cibles && S.cfg.cibles[id]) || null;
  return Math.max(S.cfg.distance * 0.45, repere ? repere * 0.6 : 0);
}

function markPending(id, st) {
  const p = pending(id); if (p < 0) return;
  pushUndo(`${S.names[id]}, rép. ${p + 1} ${st === 'manque' ? 'manquée' : 'non faite'}`); S.res[id][p] = { t: null, st }; moveToEnd(id);
  display[laneOf(id)] = [...S.queue[laneOf(id)]]; save(); checkFinish();
}

// Fin de série : automatique quand chaque nageur a toutes ses répétitions, ou via « Terminer ».
function allDone() { return S.lanes.flat().every(id => pending(id) < 0); }
function cbPending() { return S.lanes.flat().some(id => cbTarget(id) != null); }
// La série se range seule quand tout est chronométré ET que les coups de bras de la dernière rép. sont notés.
function checkFinish() {
  if (S.T0 == null || S.done || !allDone() || cbPending()) return;
  clearTimeout(finishTimer);
  finishTimer = setTimeout(() => { if (S && !S.done && view === 'chrono' && allDone()) finishSeries(false); }, 1500);
}
function finishSeries(manual) {
  if (manual) S.lanes.flat().forEach(id => S.res[id].forEach((x, r) => { if (!x) S.res[id][r] = { t: null, st: 'manque' }; }));
  S.done = true; S.endedAt = Date.now();
  try { localStorage.removeItem(KEY); } catch (e) {}
  save(); undoStack = []; clearTimeout(finishTimer);
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  closeLayer(); view = 'recap'; render(); toast("Série terminée · rangée dans l'historique");
  setTimeout(autoEnvoi, 1500);
}
function setResult(id, r, val) { pushUndo(); S.res[id][r] = val; touched(); save(); }
function nextCycle() { return repsLancees(); }
function moveInOrder(id, dir) {
  const l = laneOf(id), arr = S.laneOrder[l], i = arr.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return null;
  pushUndo();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  const from = nextCycle();
  arr.forEach((sid, idx) => { for (let r = from; r < nb(); r++) S.order[sid][r] = idx + 1; });
  if (S.T0 == null) { S.queue[l] = [...arr]; display[l] = [...arr]; }
  save(); return from;
}
// Change un nageur de ligne d'eau : il part en dernier dans sa nouvelle ligne, à partir de la répétition suivante.
// Les têtes de ligne partent toutes ensemble, donc seul l'ordre dans la ligne compte pour son départ.
function moveToLane(id, to) {
  const from = laneOf(id);
  if (to === from || to < 0 || to >= S.lanes.length) return null;
  pushUndo();
  [S.lanes, S.laneOrder, S.queue].forEach(t => { t[from] = t[from].filter(x => x !== id); t[to].push(id); });
  const r0 = nextCycle();
  [from, to].forEach(l => S.laneOrder[l].forEach((sid, idx) => { for (let r = r0; r < nb(); r++) S.order[sid][r] = idx + 1; }));
  syncDisplay(); save(); return r0;
}
// Absent (avant le départ) : retiré de la grille, jamais envoyé au Sheet ; ceux derrière lui remontent d'une place.
function markAbsent(id) {
  const l = laneOf(id); if (S.T0 != null || l < 0) return;
  pushUndo();
  [S.lanes, S.laneOrder, S.queue].forEach(t => { t[l] = t[l].filter(x => x !== id); });
  S.laneOrder[l].forEach((sid, idx) => S.order[sid].fill(idx + 1));
  S.absents = [...(S.absents || []), id];
  syncDisplay(); save();
}
// Sort de l'eau (pendant la série) : ses répétitions restantes passent en « non faite ».
// Sa place de départ reste vide : les autres gardent leur vague, comme au bassin (test du 10/11 : les décaler faussait leurs temps).
function withdraw(id) {
  const p = pending(id), l = laneOf(id); if (S.T0 == null || p < 0) return;
  pushUndo(`${S.names[id]} sorti de l'eau`);
  for (let r = p; r < nb(); r++) if (!S.res[id][r]) S.res[id][r] = { t: null, st: 'non_faite' };
  moveToEnd(id); display[l] = [...S.queue[l]]; touched(); save(); checkFinish();
}
// Ajout d'un nageur (avant le départ), pris dans la liste Nageurs du Sheet, tous groupes : il part en dernier dans sa ligne.
// Pas de cible (aucune référence pour lui dans cette série) ; dans une série spé, il nage sa spé.
function addSwimmer(id, l) {
  const n = (PLAN && PLAN.nageurs || []).find(x => String(x.id_nageur) === id);
  if (S.T0 != null || !n || laneOf(id) >= 0) return;
  pushUndo();
  [S.lanes, S.laneOrder, S.queue].forEach(t => t[l].push(id));
  S.order[id] = Array(nb()).fill(S.laneOrder[l].length);
  S.res[id] = Array(nb()).fill(null);
  S.info[id] = { nom: String(n.nom), prenom: String(n.prenom) };
  S.names[id] = n.prenom ? `${n.prenom} ${String(n.nom).charAt(0)}.` : String(n.nom);
  const nagesSerie = [...new Set(Object.values(S.cfg.nages || {}).filter(Boolean))];
  const spe = String(n.spe || '').split(/[;,\/]/)[0].trim();
  S.cfg.nages = Object.assign(S.cfg.nages || {}, { [id]: nagesSerie.length > 1 ? spe : (nagesSerie[0] || S.cfg.nage) });
  S.cfg.perLane = Math.max(...S.lanes.map(x => x.length));
  S.absents = (S.absents || []).filter(x => x !== id);
  syncDisplay(); save();
}
function openAdd() {
  const actif = n => n.actif !== false && String(n.actif).toUpperCase() !== 'FALSE';
  const libres = (PLAN && PLAN.nageurs || []).filter(n => actif(n) && laneOf(String(n.id_nageur)) < 0);
  const groupes = [...new Set(libres.map(n => String(n.groupe)))].sort((a, b) => (a === S.cfg.groupe) - (b === S.cfg.groupe) || a.localeCompare(b));

function leadRep() { return repsLancees(); }

// ---------- Départ calé sur la trotteuse du bassin ----------
// On touche « Caler » quand l'aiguille passe au 60 : l'app retient ce calage (phase dans la minute) sur l'appareil.
// Ensuite « Au prochain 60 / 30 » programme le départ : décompte, bips 3-2-1, et le chrono part tout seul.
const KEY_TROT = 'chrono-trotteuse';
let departPrevu = null, dernierBip = null, departMarque = 60;
function phaseTrotteuse() { const v = getLS(KEY_TROT); return v === null || v === '' ? null : Number(v); }
function calerTrotteuse() { setLS(KEY_TROT, String(Date.now() % 60000)); }
// marque : position de l'aiguille au moment du départ (60 = en haut, 30 = en bas). Un tour d'aiguille = 60 s.
// « Au prochain 30 » part donc quand l'aiguille est sur le 30, jamais sur le 60.
function prochainTop(marque) {
  const now = Date.now(), cible = (phaseTrotteuse() + (marque % 60) * 1000) % 60000;
  let t = now + (((cible - now % 60000) % 60000) + 60000) % 60000;
  if (t - now < 3000) t += 60000; // trop juste pour se placer : tour suivant
  return t;
}
// Où l'app situe l'aiguille (1 à 60) : à comparer d'un coup d'œil avec la trotteuse du bassin.
function aiguille(now) { return Math.floor(((((now - phaseTrotteuse()) % 60000) + 60000) % 60000) / 1000) || 60; }
function lancerDepart(t0) { pushUndo(); S.T0 = t0; S.pauses = []; S.pause = null; save(); keepAwake(); bip(1500, 0.35); renderChrono(); }

// ---------- Pause : fige les départs à venir, pas les nageurs déjà dans l'eau ----------
// À la reprise, tous les départs restants sont décalés de la durée de la pause ; le prochain laisse au moins 5 s pour se placer.
const REPRISE_MIN_MS = 5000;
function pauser() {
  if (S.T0 == null || S.pause || S.done) return;
  S.pause = { at: Date.now() }; save(); bip(600, 0.2); tick();
}
// cible (facultatif) : instant voulu pour le prochain départ, par exemple le prochain 60 de la trotteuse.
function reprendre(cible) {
  if (!S.pause) return;
  const now = Date.now(); let mini = Infinity;
  S.lanes.flat().forEach(id => {
    const p = pending(id); if (p < 0) return;
    for (let r = p; r < nb(); r++) { const d = dep(id, r) - now; if (d >= 0) { mini = Math.min(mini, d); break; } } // 0 : départ figé pile au début de la pause
  });
  const ajout = cible && isFinite(mini) ? cible - now - mini : (mini < REPRISE_MIN_MS ? REPRISE_MIN_MS - mini : 0);
  const dur = now - S.pause.at + ajout;
  pushUndo('reprise après pause');
  S.pauses = [...(S.pauses || []), { at: S.pause.at, dur }]; S.pause = null;
  save(); bip(1200, 0.2); closeLayer(); tick();
  toast(cible ? `Reprise · prochain départ dans ${Math.round((cible - now) / 1000)}"` : `Reprise · départs décalés de ${Math.round(dur / 1000)}"`);
}
function openReprise() {
  const cale = phaseTrotteuse() != null;
  $('#layer').innerHTML = `
  <div class="overlay" id="ov"><div class="sheet" role="dialog" aria-label="Reprendre la série">
    <h2>Reprendre la série</h2>
    <p class="note">Les nageurs repartent dans le même ordre, à la répétition où ils en étaient.</p>
    ${cale ? `<div class="row"><button class="btn go big" id="r60">Au prochain 60 · ${Math.ceil((prochainTop(60) - Date.now()) / 1000)}"</button>
      <button class="btn big" id="r30">Au prochain 30 · ${Math.ceil((prochainTop(30) - Date.now()) / 1000)}"</button></div>` : ''}
    <button class="btn" id="rnow">Tout de suite (prochain départ dans 5")</button>
    <button class="btn" id="rclose">Rester en pause</button>
  </div></div>`;
  if (cale) { $('#r60').onclick = () => reprendre(prochainTop(60)); $('#r30').onclick = () => reprendre(prochainTop(30)); }
  $('#rnow').onclick = () => reprendre();
  $('#rclose').onclick = closeLayer;
}
// Top mural : pendant la série, on touche au passage du 60 de l'horloge du bassin.
// L'écart avec le calage mesure la dérive entre l'iPad et l'horloge : les départs à venir sont décalés d'autant.
function topMural() {
  const now = Date.now(), ph = phaseTrotteuse();
  if (ph == null) { calerTrotteuse(); toast('Trotteuse calée'); return; }
  let ecart = (((now - ph) % 60000) + 60000) % 60000; if (ecart > 30000) ecart -= 60000;
  if (Math.abs(ecart) > 10000) { toast(`Écart de ${fmt(ecart / 1000, 1)} : trop grand, touche bien au passage du 60`); return; }
  pushUndo(`recalage sur l'horloge (${ecart >= 0 ? '+' : ''}${fmt(ecart / 1000, 1)})`);
  S.pauses = [...(S.pauses || []), { at: now, dur: ecart }];
  calerTrotteuse(); save(); bip(1200, 0.12); tick();
  toast(`Recalé sur l'horloge : départs à venir ${ecart >= 0 ? '+' : ''}${fmt(ecart / 1000, 1)}`);
}

// ---------- Signal sonore (au tap, aux départs) ----------
const KEY_SON = 'chrono-son';
let audio = null;
function sonActif() { return getLS(KEY_SON) !== '0'; }
function bip(freq = 1000, duree = 0.07) {
  if (!sonActif()) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; g.gain.value = 0.25;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + duree);
  } catch (e) {}
}

// Pavé docké en bas : il ne recouvre pas les tuiles, les arrivées restent tapables pendant la saisie.
let pad = null; // { id, r, i: longueur en cours, buf: chiffres tapés }
function openPad(id, r) {
  const a = cbOf(id, r) || [];
  const i = Math.max(0, Array.from({ length: nLen() }, (_, k) => a[k]).findIndex(v => v == null));
  pad = { id, r, i: Math.min(i, nLen() - 1), buf: '' };
  renderPad();
}
function closePad() { pad = null; const box = $('#padbox'); if (box) box.innerHTML = ''; }
function padCommit() {
  if (!pad || pad.buf === '') return;
  const a = Array.from({ length: nLen() }, (_, k) => (cbOf(pad.id, pad.r) || [])[k] ?? null);
  a[pad.i] = Number(pad.buf); pad.buf = '';
  setCb(pad.id, pad.r, a);
  if (pad.i < nLen() - 1) pad.i++;
  else { const n = S.names[pad.id]; closePad(); toast(`Coups de bras notés · ${n}`); checkFinish(); return; }
  renderPad();
}
function padKey(k) {
  if (!pad) return;
  if (k === 'ok') { if (pad.buf === '') { pad.i < nLen() - 1 ? (pad.i++, renderPad()) : closePad(); } else padCommit(); return; }
  if (k === 'del') {
    if (pad.buf) pad.buf = pad.buf.slice(0, -1);
    else { const a = (cbOf(pad.id, pad.r) || []).slice(); if (a[pad.i] != null) { a[pad.i] = null; setCb(pad.id, pad.r, Array.from({ length: nLen() }, (_, x) => a[x] ?? null)); } else if (pad.i > 0) pad.i--; }
    renderPad(); return;
  }
  pad.buf += k;
  if (pad.buf.length >= 2) padCommit(); else renderPad(); // 2 chiffres = longueur suivante
}
function renderPad() {

    <div class="pad-head"><b>${esc(S.names[pad.id])}</b><span>rép. ${pad.r + 1} · coups de bras par ${S.cfg.bassin || 25} m</span><button class="btn" id="pad-x">Fermer</button></div>

    <div class="pad-keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'del', 'ok'].map(k => `<button class="pad-key ${k === 'ok' ? 'go' : ''}" data-key="${k}">${k === 'del' ? '⌫' : k === 'ok' ? 'OK' : k}</button>`).join('')}</div>

function isBout() { return (S.cfg.view || '').startsWith('bout'); }

function buildGrid() {
  const box = $('#lanes'); if (!box) return;
  tileEls = {};
  presses.forEach(p => clearTimeout(p.timer)); presses.clear();
  box.innerHTML = '';
  // La grille reproduit le bassin tel que le chronométreur le voit depuis sa place.
  const bout = isBout(), order = display.map((_, l) => l);
  if (S.cfg.view === 'cote-bas' || S.cfg.view === 'bout-droite') order.reverse();
  order.forEach(l => {
    const ids = display[l];
    const lane = document.createElement('div'); lane.className = 'lane' + (bout ? ' bout' : '');
    lane.innerHTML = `<div class="lane-tag">${bout ? 'L' : ''}${laneLabel(l)}</div><div class="tiles" style="${bout ? 'grid-template-rows' : 'grid-template-columns'}: repeat(${Math.max(1, ids.length)}, minmax(0, 1fr))"></div>`;
    const tiles = lane.querySelector('.tiles');
    ids.forEach(id => {
      const el = document.createElement('div'); el.className = 'tile';
      el.innerHTML = `<div class="name">${esc(S.names[id])}</div><div class="time num"></div><div class="cd num" hidden></div><div class="meta num"></div><div class="sqs"><div class="sq nage" data-sq="nage"></div><div class="sq cbq off" data-sq="cb">CB</div></div>`;
      bindPress(el, id); tiles.appendChild(el); tileEls[id] = el;
    });
    box.appendChild(lane);
  });
  tick();
}

function bindPress(el, id) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const t = Date.now(); // l'instant du toucher fait foi, pas celui du relâcher
    try { el.setPointerCapture(e.pointerId); } catch (err) {} // le relâcher revient à cette tuile, même si le doigt glisse
    // Petit carré (nage / CB) : actif seulement si le nageur ne nage pas ; sinon c'est un tap chrono comme le reste de la tuile.
    const sq = e.target && e.target.closest ? e.target.closest('.sq') : null;
    if (sq && !nageEnCours(id, t)) { presses.set(e.pointerId, { id, t, x: e.clientX, y: e.clientY, long: false, timer: null, sq: sq.dataset.sq }); return; }
    el.classList.add('pressing');
    const p = { id, t, x: e.clientX, y: e.clientY, long: false, timer: setTimeout(() => { p.long = true; el.classList.remove('pressing'); openMenu(id); }, LONG_PRESS_MS) };
    presses.set(e.pointerId, p);
  });
  el.addEventListener('pointermove', e => {
    // Un doigt mouillé qui glisse n'est pas un appui long : on garde le tap, on annule le menu.
    const p = presses.get(e.pointerId);
    if (p && !p.long && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 12) { clearTimeout(p.timer); el.classList.remove('pressing'); }
  });
  const end = (e, commit) => {
    const p = presses.get(e.pointerId); if (!p) return;
    presses.delete(e.pointerId); clearTimeout(p.timer); el.classList.remove('pressing');
    if (p.sq) { if (commit) tapCarre(p.id, p.sq); return; }
    if (!p.long && (commit || Date.now() - p.t < LONG_PRESS_MS)) tap(p.id, p.t);
  };
  el.addEventListener('pointerup', e => end(e, true));
  // L'iPad annule parfois un toucher près du bord (gestes système) : un toucher bref reste un tap.
  el.addEventListener('pointercancel', e => end(e, false));
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function tick() {
  if (view !== 'chrono' || !S) return;
  const now = Date.now();
  const clock = $('#clock'), rep = $('#rep');
  // Départ programmé sur la trotteuse : décompte, bips 3-2-1, départ automatique pile au top
  if (S.T0 == null) {
    const info = $('#trot-info');
    if (departPrevu) {
      const reste = Math.ceil((departPrevu - now) / 1000);
      if (reste <= 3 && reste >= 1 && dernierBip !== reste) { dernierBip = reste; bip(800, 0.12); }
      if (now >= departPrevu) { const t0 = departPrevu; departPrevu = null; dernierBip = null; lancerDepart(t0); return; }
      if (info) info.textContent = `Départ au ${departMarque} dans ${reste}"`;
    } else if (info) {
      const ph = phaseTrotteuse();
      info.textContent = ph == null ? 'Départ au top de la trotteuse : cale-la d\'abord' : `Aiguille sur ${aiguille(now)}`;
    }
    const s60 = $('#t60s'), s30 = $('#t30s');
    if (s60) s60.textContent = `${Math.ceil((prochainTop(60) - now) / 1000)}"`;
    if (s30) s30.textContent = `${Math.ceil((prochainTop(30) - now) / 1000)}"`;
  }
  const finished = S.T0 != null && allDone();
  if (clock) clock.textContent = S.T0 == null ? '00:00' : finished ? 'Fini' : fmtClock(now - S.T0);
  if (rep) rep.innerHTML = S.T0 == null ? `${S.cfg.nbRep} × ${S.cfg.distance} · départ ${fmtCycle(S.cfg.cycle)} · vagues ${S.cfg.vague}"`
    : finished ? `Coups de bras à noter, puis la série se range`
    : S.pause ? `⏸ <b>Pause</b> depuis ${fmtClock(now - S.pause.at)} · départs figés` : `Rép. <b>${leadRep()}</b> / ${nb()}`;
  const pb = $('#pause');
  if (pb) {
    const lab = S.pause ? '▶ Reprendre' : '⏸ Pause';
    if (pb.textContent !== lab) { pb.textContent = lab; pb.classList.toggle('go', !!S.pause); }
    pb.hidden = finished;
  }
  for (const id in tileEls) {
    const el = tileEls[id], p = pending(id), r = S.res[id];
    const last = r.slice().reverse().find(x => x && x.st === 'ok');
    const autoMiss = r.some(x => x && x.auto);
    // Une forme par information (retour terrain du 10/11) : dans l'eau = tuile blanche et temps qui défile ;
    // au mur = tuile foncée, temps nagé en gros ; décompte = pastille « ⏱ 12" » toujours au même endroit ; 3 dernières s = rouge.
    let cls = 'tile', time = '', meta = '', cd = '';
    if (p < 0) { cls += ' done'; time = last ? fmt(last.t) : 'Fini'; meta = 'série finie'; }
    else if (S.T0 == null) { cls += ' wait'; time = `${S.order[id][0]}ᵉ départ`; meta = `rép. 1 / ${nb()}`; }
    else {
      const d = dep(id, p);
      meta = `rép. ${p + 1} / ${nb()}`;
      if (now < d) {
        const reste = Math.ceil((d - now) / 1000), prev = p > 0 ? r[p - 1] : null, fige = !!S.pause;
        cls += ' wait' + (fige ? ' pause' : d - now <= 3000 ? ' go' : '');
        if (!fige && d - now <= 3000) time = `${reste}"`; // le lancer : chiffre seul, énorme, sur fond rouge
        else {
          cd = `${fige ? '⏸' : '⏱'} ${reste}"`;
          if (prev && prev.st === 'ok') { cls += ' rest'; time = fmt(prev.t); meta = `au mur · rép. ${p + 1} / ${nb()}`; }
          else time = p === 0 ? 'au départ' : 'au mur';
        }
      }
      else { cls += ' swim'; time = fmt((now - d) / 1000, 1); meta = `dans l'eau · rép. ${p + 1} / ${nb()}`; if (now >= expected(id, p) - HOT_BEFORE_MS) cls += ' hot'; }
    }
    if (S.T0 != null && cbTarget(id) != null) { cls += ' cb'; meta = 'CB à noter' + (meta ? ' · ' + meta : ''); }
    // Petits carrés : lettre de la nage à venir, état des coups de bras de la dernière répétition nagée
    const sn = el.querySelector('.sq.nage'), sc = el.querySelector('.sq.cbq');
    if (sn && sc) {
      const ln = lettreNage(nageDe(id, repCourante(id)));
      if (sn.textContent !== ln) sn.textContent = ln;
      const lastOk = r.reduce((acc, x, i) => (x && x.st === 'ok' ? i : acc), -1), du = S.T0 != null && cbTarget(id) != null;
      const cq = 'sq cbq' + (lastOk < 0 ? ' off' : du ? ' due' : ''), ct = lastOk >= 0 && !du && cbComplete(id, lastOk) ? 'CB✓' : 'CB';
      if (sc.className !== cq) sc.className = cq;
      if (sc.textContent !== ct) sc.textContent = ct;
    }
    if (el.classList.contains('pressing')) cls += ' pressing';
    if (el.classList.contains('tapped')) cls += ' tapped';
    if (el.classList.contains('refus')) cls += ' refus';
    if (el.className !== cls) el.className = cls;
    el.querySelector('.time').textContent = time;
    el.querySelector('.meta').textContent = meta;
    const cde = el.querySelector('.cd');
    if (cde) { if (cde.textContent !== cd) cde.textContent = cd; cde.hidden = !cd; }
    let b = el.querySelector('.badge');
    if (autoMiss && !b) { b = document.createElement('div'); b.className = 'badge'; b.textContent = 'manqué'; el.appendChild(b); }
    if (!autoMiss && b) b.remove();
  }
}

// ---------- Récap ----------
// ---------- RPE : un chiffre 0–10 par nageur et par série ----------
function rpeOf(id) { return S.rpe && S.rpe[id] != null ? S.rpe[id] : null; }
function rpeMissing() { return S.lanes.flat().filter(id => rpeOf(id) == null).length; }
// seq = enchaînement : après chaque choix, on passe au nageur suivant (ordre des lignes), comme quand tu fais le tour du bassin.
function openRpe(id, seq) {
  const ids = S.lanes.flat(), i = ids.indexOf(id), cur = rpeOf(id);
  $('#layer').innerHTML = `
  <div class="overlay" id="ov"><div class="sheet" role="dialog" aria-label="RPE de ${esc(S.names[id])}">

  $('#r-close').onclick = finish;
  $('#ov').addEventListener('pointerdown', e => { if (e.target.id === 'ov') finish(); });
}

      ${S.done && !S.cfg.essai ? `<button class="btn big" id="send-one">${S.sentAt ? 'Renvoyer au Sheet' : 'Envoyer au Sheet'}</button>` : ''}</div>
    ${S.done ? `<p class="note">${S.cfg.essai ? "Série d'essai : elle reste sur cet appareil." : S.sentAt ? `Envoyée au Sheet le ${fmtDate(S.sentAt)}.` : 'Pas encore envoyée au Sheet. Elle reste en attente sur cet appareil.'}</p>` : ''}
    <div class="actions">${S.done ? `<button class="btn danger" id="del">Supprimer de l'historique</button>` : `<button class="btn danger" id="end2">Terminer la série</button>`}</div>
  </div></div></div>`;
  $('#app').querySelectorAll('td.cell[data-r]').forEach(td => td.onclick = () => openFix(td.dataset.id, +td.dataset.r));
  $('#app').querySelectorAll('td.rpe-cell').forEach(td => td.onclick = () => openRpe(td.dataset.rpe, false));
  if ($('#send-one')) $('#send-one').onclick = async () => {
    const b = $('#send-one'); b.disabled = true; b.textContent = 'Envoi…';
    try { await envoyer([S]); toast('Série envoyée au Sheet'); } catch (e) { toast(e.message); }
    render();
  };
  $('#rpe-all').onclick = () => { const ids = S.lanes.flat(); openRpe(ids.find(id => rpeOf(id) == null) || ids[0], true); };
  if (S.done) {
    $('#home').onclick = () => { S = null; view = 'setup'; render(); autoEnvoi(); };
    armed($('#del'), 'Confirmer : supprimer', () => {
      HIST = HIST.filter(h => h.uid !== S.uid);
      try { localStorage.setItem(KEY_HIST, JSON.stringify(HIST)); } catch (e) {}
      S = null; view = 'setup'; render(); toast('Série supprimée');
    });
  } else {
    $('#back').onclick = () => { view = 'chrono'; render(); };
    armed($('#end2'), 'Confirmer la fin', () => finishSeries(true));
  }
}

function render() {
  if (view === 'setup' || !S) renderSetup();
  else if (view === 'chrono') renderChrono();
  else renderRecap();
}

// Reprise après fermeture de l'app ou batterie vide
HIST = loadHist();
S = load();
if (S && S.T0 != null) { syncDisplay(); view = 'chrono'; } else S = null;
render();
autoEnvoi();
</script>
<script>
// Hors ligne : le service worker garde l'app sur l'appareil après la première ouverture.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
